<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Sheets">
<title>Party Sheets</title>
<style>
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --ink:#1d2a27; --muted:#5d6e69; --line:#cdd7d3;
  --accent:#1f6f66; --accent-ink:#ffffff; --brass:#9a6b1a;
  --hp-ok:#2e8b57; --hp-mid:#c98a14; --hp-low:#b83a32; --chip:#e3ebe8; --field:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121917; --panel:#1a2421; --ink:#e4ece9; --muted:#97aaa4; --line:#2d3b37;
    --accent:#4fb3a6; --accent-ink:#0b1412; --brass:#d9a441;
    --hp-ok:#4cc27f; --hp-mid:#e0a63a; --hp-low:#e0675e; --chip:#25322e; --field:#141c19;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:0;font-weight:700;letter-spacing:.01em}
button,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 0 16px;border-bottom:2px solid var(--brass);margin-bottom:18px}
header.top h1{font-size:1.9rem}
.sub{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--chip);font-size:.8rem;font-weight:600}
.badge.dm{background:var(--brass);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--hp-low)}
.btn.dmg{color:var(--hp-low);border-color:var(--hp-low)}
.btn.heal{color:var(--hp-ok);border-color:var(--hp-ok)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:var(--hp-low)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.15rem;line-height:1.2}
.card .who{color:var(--muted);font-size:.85rem}
.hpbar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.hpbar>i{display:block;height:100%}
.hprow{display:flex;align-items:center;gap:6px;justify-content:space-between}
.hpnum{font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat{background:var(--chip);border-radius:8px;padding:4px 2px}
.stat b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.conds{font-size:.82rem;color:var(--hp-low);min-height:1em}
.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
.row{display:grid;gap:10px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{min-height:70px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:1;background:transparent;border-color:transparent;padding-left:0}
.section{margin-top:14px}
details.section>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-family:Georgia,"Iowan Old Style",serif;font-weight:700;font-size:1.05rem;border-bottom:1px solid var(--line);margin-bottom:8px}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::before{content:"▸";display:inline-block;width:1em;color:var(--brass);transition:transform .15s}
details.section[open]>summary::before{transform:rotate(90deg)}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ab{background:var(--chip);border-radius:10px;padding:8px 4px;text-align:center}
.ab .nm{font-size:.75rem;color:var(--muted);font-weight:700}
.ab .md{font-size:1.4rem;font-weight:700;font-family:Georgia,serif}
.ab input{width:60px;text-align:center;margin:0 auto;padding:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.prof{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.92rem}
.prof .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.prof input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.slot{background:var(--chip);border-radius:8px;padding:6px 8px;font-size:.85rem}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);background:transparent;padding:0}
.pip.used{background:var(--accent)}
.atk{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:6px;margin-bottom:10px}
.atk>:nth-child(5){grid-column:1/-1}
.entry{margin-bottom:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--field)}
.entry-h{display:flex;gap:6px;margin-bottom:6px}
.entry-h input{font-weight:700}
.entry textarea{border-color:transparent;padding:6px 2px;overflow:hidden}
.note{background:var(--chip);padding:10px 14px;border-radius:8px;font-size:.9rem;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.codes{margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.codes>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.coderow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.coderow .nm{flex:1 1 140px;min-width:0}
.coderow code{font-size:1rem;background:var(--chip);padding:4px 8px;border-radius:6px;user-select:all}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:10px}
.gatecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.gatecard h2{font-size:1.25rem}
.msg{font-size:.9rem;min-height:1.2em}
.msg.err{color:var(--hp-low)}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--brass);margin:-16px -16px 14px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sbar-title{display:flex;flex-direction:column;min-width:0;flex:1 1 140px}
.sbar-title strong{font-family:Georgia,serif;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpctl{display:flex;gap:6px;align-items:center;flex:1 1 100%}
.hpctl input{width:80px;text-align:center}
.hpctl .btn{flex:1}
.lvl{background:var(--chip);border:2px solid var(--brass);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.lvl h3{font-size:1.1rem}
.hist{font-size:.9rem;padding:4px 0;border-bottom:1px solid var(--line)}
@media (min-width:701px){.hpctl{flex:0 0 auto}.sbar{flex-wrap:nowrap}}
@media (max-width:700px){
  .wrap{padding:10px}
  header.top{padding:4px 0 12px;margin-bottom:12px;gap:8px}
  header.top h1{font-size:1.5rem}
  header.top>div:last-child{width:100%}
  header.top>div:last-child .btn{flex:1 1 auto}
  body.sheet-open header.top,body.sheet-open #partySec,body.sheet-open #notice,body.sheet-open #dmBar{display:none}
  .grid{grid-template-columns:1fr}
  .sheet{margin-top:0;padding:16px 12px;border-radius:0;border-left:0;border-right:0}
  .sbar{margin:-16px -12px 12px;padding:8px 12px}
  .btn{min-height:44px;padding:8px 14px}
  .btn.small{min-height:40px;min-width:40px;padding:6px 12px;font-size:.92rem}
  input[type=text],input[type=number],textarea,select{padding:10px;font-size:16px}
  .two{grid-template-columns:1fr;gap:0}
  .abil{grid-template-columns:repeat(3,1fr)}
  .prof{padding:2px 0;min-height:44px}
  .prof input[type=checkbox]{width:26px;height:26px}
  .pip{width:32px;height:32px}
  .pips{gap:6px}
  .slot input[type=number]{padding:6px 4px!important;width:64px!important}
  .ab input{width:72px;padding:6px}
  .atk{grid-template-columns:1fr 2fr auto}
  .atk>:nth-child(1){grid-column:1/3;grid-row:1}
  .atk>:nth-child(4){grid-column:3;grid-row:1}
  .atk>:nth-child(2){grid-column:1;grid-row:2}
  .atk>:nth-child(3){grid-column:2/4;grid-row:2}
  .atk>:nth-child(5){grid-column:1/-1;grid-row:3}
  .stats{gap:4px}
  .cols4{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){details.section>summary::before{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Party Sheets</h1>
      <div class="sub" id="who">Loading…</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status"></span>
      <button class="btn" id="outBtn" hidden>Sign out</button>
    </div>
  </header>

  <section id="gate" class="gate" hidden>
    <div class="gatecard">
      <h2>Players: open your character</h2>
      <p class="sub" style="margin:0">Enter the character code your DM gave you. No account or email needed. Keep the code: it gets you back in on a new phone.</p>
      <label class="f">Character code<input type="text" id="codeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. sarick-k7m2x9"></label>
      <button class="btn primary" id="joinBtn">Open my character</button>
      <div class="msg" id="gateMsg" role="status"></div>
    </div>
    <div class="gatecard">
      <h2>Dungeon Master</h2>
      <p class="sub" style="margin:0">Sign in with your Google account to see every sheet.</p>
      <button class="btn" id="googleBtn">Sign in with Google</button>
      <div class="msg" id="gateMsg2" role="status"></div>
    </div>
  </section>

  <main id="app" hidden>
    <div id="dmBar" hidden>
      <div class="dmbar">
        <button class="btn" id="importBtn">Import characters (JSON)</button>
        <input type="file" id="importIn" accept=".json,application/json" multiple hidden>
        <button class="btn" id="npcBtn">Add NPC</button>
      </div>
      <div class="note" id="importMsg" hidden></div>
      <details class="codes" id="codesBox"><summary>Player codes</summary><div id="codesList"></div></details>
    </div>
    <div id="notice"></div>
    <section id="partySec" aria-label="Party" hidden><div class="grid" id="party"></div></section>
    <section id="sheetHost" aria-live="polite"></section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDYnsx30sdSSQm9Khjdc8gJ_BJLjHMhL4g",
  authDomain: "dnd-campaign-companion-app.firebaseapp.com",
  projectId: "dnd-campaign-companion-app",
  storageBucket: "dnd-campaign-companion-app.firebasestorage.app",
  messagingSenderId: "305544250683",
  appId: "1:305544250683:web:6b38e7bbe9bc3e23a1231e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/*IMPORT_START*/
const ABIL=["str","dex","con","int","wis","cha"];
const ABN={str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};
const SKILLS=[["Acrobatics","dex"],["Animal Handling","wis"],["Arcana","int"],["Athletics","str"],["Deception","cha"],["History","int"],["Insight","wis"],["Intimidation","cha"],["Investigation","int"],["Medicine","wis"],["Nature","int"],["Perception","wis"],["Performance","cha"],["Persuasion","cha"],["Religion","int"],["Sleight of Hand","dex"],["Stealth","dex"],["Survival","wis"]];
const mod=n=>Math.floor((Number(n==null?10:n)-10)/2);
const sgn=n=>(n>=0?"+":"")+n;
const prof=l=>2+Math.floor((Math.max(1,Number(l)||1)-1)/4);

const CLASSES={
  barbarian:{die:12},bard:{die:8,caster:"full",ab:"cha"},cleric:{die:8,caster:"full",ab:"wis"},
  druid:{die:8,caster:"full",ab:"wis"},fighter:{die:10},monk:{die:8},
  paladin:{die:10,caster:"half",ab:"cha"},ranger:{die:10,caster:"half",ab:"wis"},rogue:{die:8},
  sorcerer:{die:6,caster:"full",ab:"cha"},warlock:{die:8,caster:"pact",ab:"cha"},
  wizard:{die:6,caster:"full",ab:"int"},artificer:{die:8,caster:"artificer",ab:"int"}
};
const FULL=[[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
const HALF=[[],[2],[3],[3],[4,2],[4,2],[4,3],[4,3],[4,3,2],[4,3,2],[4,3,3],[4,3,3],[4,3,3,1],[4,3,3,1],[4,3,3,2],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2]];
const PACT=[[1,1],[2,1],[2,2],[2,2],[2,3],[2,3],[2,4],[2,4],[2,5],[2,5],[3,5],[3,5],[3,5],[3,5],[3,5],[3,5],[4,5],[4,5],[4,5],[4,5]];
function classInfo(name){
  const n=String(name||"").toLowerCase();
  for(const k in CLASSES)if(n.indexOf(k)>=0)return CLASSES[k];
  return null;
}
function slotsFor(info,level,old){
  const out={};
  if(!info||!info.caster)return out;
  const L=Math.max(1,Math.min(20,Number(level)||1));
  let arr=[];
  if(info.caster==="full")arr=FULL[L-1];
  else if(info.caster==="half")arr=HALF[L-1];
  else if(info.caster==="artificer")arr=FULL[Math.ceil(L/2)-1];
  else if(info.caster==="pact"){const p=PACT[L-1];out[p[1]]={max:p[0],used:0}}
  arr.forEach((n,i)=>{out[i+1]={max:n,used:0}});
  if(old)Object.keys(out).forEach(k=>{const u=(old[k]&&old[k].used)||0;out[k].used=Math.min(u,out[k].max)});
  return out;
}

function blank(){
  const a={};ABIL.forEach(k=>a[k]=10);
  return {name:"New adventurer",player:"",race:"",cls:"",subclass:"",alignment:"",size:"",level:1,background:"",
    abilities:a,saveProf:{},skillProf:{},skillExtra:{},ac:10,speed:30,hpMax:10,hp:10,hpTemp:0,hitDice:"",
    deathS:0,deathF:0,inspiration:0,conditions:"",spellAbility:"",slots:{},spellList:"",spellInfo:[],
    attacks:[],actions:[],features:[],traits:[],inventory:"",gold:0,languages:"",goals:"",backstory:"",notes:"",
    history:[],npc:false,updated:0};
}
function slugify(name){
  const w=String(name||"").trim().split(/\s+/)[0]||"";
  const s=w.toLowerCase().replace(/[^a-z0-9]/g,"");
  return s||("pc"+Math.random().toString(36).slice(2,6));
}
function convert(j){
  const s=blank();
  s.name=j.name||"Unnamed";s.player=j.player||"";s.race=j.race||"";s.cls=j.class||"";s.subclass=j.subclass||"";
  s.alignment=j.alignment||"";s.size=j.size||"";s.level=Number(j.level)||1;s.background=j.background||"";
  const st=j.stats||[];
  ABIL.forEach((k,i)=>{if(st[i]!=null)s.abilities[k]=Number(st[i])});
  s.ac=Number(j.ac)||10;s.speed=parseInt(j.speed,10)||30;
  s.hpMax=Number(j.hp_max!=null?j.hp_max:j.hp)||10;
  s.hp=Number(j.hp_current!=null?j.hp_current:s.hpMax);
  s.hpTemp=Number(j.hp_temp)||0;s.hitDice=j.hit_dice||"";
  s.inspiration=Number(j.inspiration)||0;
  const pb=Number(j.proficiency)||prof(s.level);
  (j.saves||[]).forEach(t=>{
    const m=/^\s*([A-Za-z]+)/.exec(t);if(!m)return;
    const k=m[1].toLowerCase().slice(0,3);
    if(ABIL.indexOf(k)>=0)s.saveProf[k]=true;
  });
  (j.skills||[]).forEach(t=>{
    const m=/^(.*?)\s*([+-]\d+)\s*$/.exec(t);if(!m)return;
    const sk=SKILLS.filter(x=>x[0].toLowerCase()===m[1].trim().toLowerCase())[0];if(!sk)return;
    const diff=Number(m[2])-mod(s.abilities[sk[1]]);
    const lv=Math.max(0,Math.min(2,Math.floor(diff/pb)));
    const extra=diff-lv*pb;
    if(lv)s.skillProf[sk[0]]=lv;
    if(extra)s.skillExtra[sk[0]]=extra;
  });
  const info=classInfo(s.cls);
  if(info&&info.ab)s.spellAbility=info.ab;
  s.slots=slotsFor(info,s.level);
  s.languages=(j.languages||[]).join(", ");
  s.spellList=(j.spells||[]).join("\n");
  s.spellInfo=(j.spellcasting||[]).map(e=>({name:e.name||"",desc:e.desc||""}));
  const actionNames={};
  (j.actions||[]).forEach(a=>{
    const desc=a.desc||"";
    actionNames[String(a.name||"").toLowerCase()]=1;
    const hit=/([+-]\d+)\s+to hit/i.exec(desc);
    if(hit){
      const d=/Hit:\s*([^.]+?)\.(.*)$/i.exec(desc);
      s.attacks.push({name:a.name||"",bonus:hit[1],dmg:d?d[1].trim():"",notes:d?d[2].trim():""});
    }else s.actions.push({name:a.name||"",desc:desc});
  });
  const dmParts=[];
  (j.class_features||[]).forEach(f=>{
    const nm=f.name||"";
    if(/DM NOTE/i.test(nm)){dmParts.push(nm+": "+(f.desc||""));return}
    if(actionNames[nm.toLowerCase()])return;
    s.features.push({name:nm,desc:f.desc||""});
  });
  (j.traits||[]).forEach(t=>s.traits.push({name:t.name||"",desc:t.desc||""}));
  s.goals=(j.goals||[]).join("\n");
  s.backstory=j.backstory||"";
  const inv=[];
  (j.equipment||[]).forEach(line=>{
    const g=/^\s*(\d+)\s*gp\b[,\s]*(.*)$/i.exec(line);
    if(g){s.gold=Number(g[1]);if(g[2])inv.push(g[2])}
    else inv.push(line);
  });
  s.inventory=inv.join("\n");
  if(j.notes)dmParts.unshift(j.notes);
  s.updated=Date.now();
  return {sheet:s,dm:dmParts.join("\n\n")};
}
/*IMPORT_END*/

/* ---------- state ---------- */
let uid=null, role=null, charId=null, isAnon=false;
let chars={}, dmNotes={}, claimByChar={};
let openId=null, unsubs=[], enterTok=0, lvlUp=null, hpAmtVal="1";
const pending={}, writing={}, noteTimers={}, secOpen={};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WIDE=()=>matchMedia("(min-width:701px)").matches;
const isDM=()=>role==="dm";
function setStatus(t,err){
  ["status","sbarSave"].forEach(id=>{const s=$(id);if(s){s.textContent=t||"";s.className=(id==="status"?"status":"sub")+(err?" err":"")}});
}
function normalize(d){
  const b=blank(),o=Object.assign({},b,d);
  o.abilities=Object.assign({},b.abilities,d.abilities||{});
  ["saveProf","skillProf","skillExtra","slots"].forEach(k=>{o[k]=d[k]||{}});
  ["spellInfo","attacks","actions","features","traits","history"].forEach(k=>{o[k]=Array.isArray(d[k])?d[k]:[]});
  o.inspiration=Number(d.inspiration)||0;
  return o;
}
function canEditChar(id){return !!chars[id]&&(isDM()||id===charId)}
function skillTotal(c,s){
  return mod(c.abilities[s[1]])+(Number(c.skillProf[s[0]])||0)*prof(c.level)+(Number(c.skillExtra[s[0]])||0);
}
function passive(c){return 10+skillTotal(c,["Perception","wis"])}

/* ---------- saving ---------- */
function queueSave(id,keys){
  const c=chars[id];if(!c)return;
  c.updated=Date.now();
  const p=pending[id]||(pending[id]={keys:new Set()});
  keys.forEach(k=>p.keys.add(k));p.keys.add("updated");
  clearTimeout(p.timer);p.timer=setTimeout(()=>flush(id),700);
  setStatus("Saving…");
}
async function flush(id){
  const p=pending[id];if(!p||!p.keys.size||!chars[id])return;
  if(writing[id]){p.timer=setTimeout(()=>flush(id),300);return}
  const keys=Array.from(p.keys);p.keys=new Set();writing[id]=true;
  const data={};keys.forEach(k=>{data[k]=chars[id][k]});
  try{
    await setDoc(doc(db,"characters",id),data,{mergeFields:keys});
    if(!p.keys.size)setStatus("Saved");
  }catch(e){
    keys.forEach(k=>p.keys.add(k));
    setStatus("Could not save ("+(e&&e.code||"error")+")",true);
  }finally{writing[id]=false}
}
function queueNote(id){
  clearTimeout(noteTimers[id]);setStatus("Saving…");
  noteTimers[id]=setTimeout(async()=>{
    try{await setDoc(doc(db,"dmnotes",id),{text:dmNotes[id]||""});setStatus("Saved")}
    catch(e){setStatus("Could not save notes ("+(e&&e.code||"error")+")",true)}
  },700);
}

$("sheetHost").addEventListener("toggle",e=>{

/* ---------- editing ---------- */
function setPath(obj,path,val){
  const p=path.split(".");let o=obj;
  for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}
  o[p[p.length-1]]=val;
}
function commit(id,keys,rerender){queueSave(id,keys);renderParty();if(rerender)renderSheet()}

$("sheetHost").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="hpAmt"){hpAmtVal=t.value;return}
  if(t.dataset&&t.dataset.dm==="notes"&&isDM()&&openId){dmNotes[openId]=t.value;autosize(t);queueNote(openId);return}
  const path=t.getAttribute("data-path");
  if(!path||!openId||!canEditChar(openId))return;
  let val;
  if(t.type==="checkbox")val=t.checked;
  else if(t.type==="number")val=t.value===""?0:Number(t.value);
  else val=t.value;
  setPath(chars[openId],path,val);
  if(t.tagName==="TEXTAREA")autosize(t);
  const sb=$("sbarStat");if(sb)sb.textContent=sbarStat(chars[openId]);
  commit(openId,[path.split(".")[0]],false);
});
$("sheetHost").addEventListener("change",e=>{
  const t=e.target,path=t.getAttribute("data-path");
  if(!path||!openId||!canEditChar(openId))return;
  if(/^(abilities|level|spellAbility|slots|saveProf)/.test(path)||t.type==="checkbox")renderSheet();
});
$("sheetHost").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||!openId)return;
  const act=b.getAttribute("data-act"),c=chars[openId];
  if(act==="signout"){doSignOut();return}
  if(act==="close"){openId=null;lvlUp=null;renderSheet();window.scrollTo(0,0);return}
  if(!c)return;
  if(act==="delsheet"&&isDM()){
    if(!confirm("Delete “"+(c.name||"this sheet")+"” for good? This also removes its DM notes and player code."))return;
    const id=openId;openId=null;lvlUp=null;renderSheet();window.scrollTo(0,0);
    try{
      await deleteDoc(doc(db,"characters",id));
      await deleteDoc(doc(db,"dmnotes",id));
      if(claimByChar[id])await deleteDoc(doc(db,"claims",claimByChar[id]));
    }catch(err){setStatus("Could not delete ("+(err&&err.code||"error")+")",true)}
    return;
  }
  if(!canEditChar(openId))return;
  if(act==="dmg"||act==="heal"){
    const amt=Math.max(0,Math.floor(Number(hpAmtVal)||0));
    if(act==="dmg"){
      let rem=amt;const t=Math.min(c.hpTemp||0,rem);c.hpTemp=(c.hpTemp||0)-t;rem-=t;
      c.hp=Math.max(0,c.hp-rem);
    }else c.hp=Math.min(c.hpMax,c.hp+amt);
    commit(openId,["hp","hpTemp"],true);return;
  }
  if(act==="skill"){const s=b.getAttribute("data-skill");c.skillProf[s]=((Number(c.skillProf[s])||0)+1)%3;commit(openId,["skillProf"],true)}
  else if(act==="pip"){
    const l=b.getAttribute("data-lvl"),i=Number(b.getAttribute("data-i")),sl=c.slots[l]||(c.slots[l]={max:0,used:0});
    sl.used=(i<sl.used)?i:i+1;commit(openId,["slots"],true);
  }
  else if(act==="addatk"){c.attacks.push({name:"",bonus:"",dmg:"",notes:""});commit(openId,["attacks"],true)}
  else if(act==="delatk"){c.attacks.splice(Number(b.getAttribute("data-i")),1);commit(openId,["attacks"],true)}
  else if(act==="addentry"){const l=b.getAttribute("data-list");(c[l]=c[l]||[]).push({name:"",desc:""});commit(openId,[l],true)}
  else if(act==="delentry"){const l=b.getAttribute("data-list");c[l].splice(Number(b.getAttribute("data-i")),1);commit(openId,[l],true)}
  else if(act==="lvlopen"){lvlUp={gain:hpGainDefault(c)};renderSheet();$("sheetHost").scrollIntoView({block:"start"})}
  else if(act==="lvlcancel"){lvlUp=null;renderSheet()}
  else if(act==="lvlconfirm"){
    const gain=Math.max(0,Math.floor(Number($("lvGain").value)||0));
    const updSlots=$("lvSlots")?$("lvSlots").checked:false;
    const info=classInfo(c.cls),die=info?info.die:8,nl=c.level+1,old=c.level;
    c.level=nl;c.hpMax+=gain;c.hp+=gain;
    const m=/^(\d+)d(\d+)$/.exec(String(c.hitDice||"").trim());
    c.hitDice=nl+"d"+(m?m[2]:die);
    if(updSlots)c.slots=slotsFor(info,nl,c.slots);
    c.history=[{t:Date.now(),text:"Level "+old+" → "+nl+": +"+gain+" max HP"}].concat(c.history).slice(0,30);
    lvlUp=null;
    commit(openId,["level","hpMax","hp","hitDice","slots","history"],true);
    window.scrollTo(0,0);
  }
});
$("party").addEventListener("click",e=>{
  const card=e.target.closest(".card"),b=e.target.closest("[data-act]");
  if(!card||!b)return;
  const id=card.getAttribute("data-id"),act=b.getAttribute("data-act");
  if(act==="open"){
    openId=id;lvlUp=null;renderSheet();
    if(WIDE())$("sheetHost").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
    else window.scrollTo(0,0);
  }else if(act==="hp"&&canEditChar(id)){
    const c=chars[id],d=Number(b.getAttribute("data-d"));
    c.hp=Math.max(0,Math.min(c.hpMax,c.hp+d));
    commit(id,["hp"],openId===id);
  }
});

/* ---------- DM tools ---------- */
function newCode(id){
  const al="abcdefghjkmnpqrstuvwxyz23456789";let s="";
  const arr=new Uint32Array(6);crypto.getRandomValues(arr);
  arr.forEach(n=>{s+=al[n%al.length]});
  return id+"-"+s;
}
async function resetCode(id){
  const old=claimByChar[id];
  if(old&&!confirm("Make a new code? The old one stops working and anyone using it is locked out of this sheet."))return;
  try{
    const code=newCode(id);
    await setDoc(doc(db,"claims",code),{charId:id});
    if(old)await deleteDoc(doc(db,"claims",old));
    setStatus("New code created");
  }catch(err){setStatus("Could not make code ("+(err&&err.code||"error")+")",true)}
}
$("codesList").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.getAttribute("data-act");
  if(act==="copy"){
    const code=b.getAttribute("data-code");
    (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>setStatus("Copied "+code)).catch(()=>{window.prompt("Copy this code:",code)});
  }else if(act==="reset")resetCode(b.getAttribute("data-id"));
});
$("npcBtn").addEventListener("click",async()=>{
  const id="npc"+Math.random().toString(36).slice(2,8);
  const c=blank();c.name="New NPC";c.npc=true;c.updated=Date.now();
  try{await setDoc(doc(db,"characters",id),c);chars[id]=c;openId=id;renderParty();renderSheet();window.scrollTo(0,0)}
  catch(err){setStatus("Could not add NPC ("+(err&&err.code||"error")+")",true)}
});
$("importBtn").addEventListener("click",()=>$("importIn").click());
$("importIn").addEventListener("change",async e=>{
  const files=Array.from(e.target.files||[]);e.target.value="";
  const msg=$("importMsg");msg.hidden=false;msg.textContent="Importing…";
  const done=[],skipped=[];
  for(const f of files){
    try{
      const j=JSON.parse(await f.text());
      const r=convert(j),id=slugify(r.sheet.name);
      if(chars[id]&&!confirm("A sheet for “"+chars[id].name+"” already exists. Replace it with "+f.name+"? This overwrites everything on that sheet."))
        {skipped.push(f.name);continue}
      await setDoc(doc(db,"characters",id),r.sheet);
      await setDoc(doc(db,"dmnotes",id),{text:r.dm});
      if(!claimByChar[id])await setDoc(doc(db,"claims",newCode(id)),{charId:id});
      done.push(r.sheet.name.split(" ")[0]);
    }catch(err){skipped.push(f.name+" ("+(err&&err.code||err&&err.message||"error")+")")}
  }
  msg.textContent=(done.length?"Imported: "+done.join(", ")+". Codes are under “Player codes”. ":"")+(skipped.length?"Skipped: "+skipped.join(", ")+".":"");
  if(done.length)$("codesBox").open=true;
});

/* ---------- live data ---------- */
function mergeIncoming(remote){
  const next={};
  Object.keys(remote).forEach(id=>{
    const r=normalize(remote[id]),p=pending[id];
    if(p&&p.keys&&p.keys.size&&chars[id])p.keys.forEach(k=>{r[k]=chars[id][k]});
    next[id]=r;
  });
  return next;
}
function afterData(){
  if(openId&&!chars[openId])openId=null;
  renderParty();renderCodes();
  if(openId&&!sheetFocused())renderSheet();
  else if(!openId)renderSheet();
}
function startApp(){
  $("gate").hidden=true;$("app").hidden=false;
  unsubs.forEach(u=>u());unsubs=[];chars={};dmNotes={};claimByChar={};lvlUp=null;
  $("who").innerHTML=(isDM()?'<span class="badge dm">Dungeon Master</span>':'<span class="badge">Player</span>');
  $("dmBar").hidden=!isDM();$("partySec").hidden=!isDM();$("outBtn").hidden=false;
  if(isDM()){
    openId=null;
    unsubs.push(onSnapshot(collection(db,"characters"),snap=>{
      const remote={};snap.docs.forEach(d=>{remote[d.id]=d.data()||{}});
      chars=mergeIncoming(remote);afterData();setStatus("Live");
    },e=>setStatus("Sync problem ("+(e&&e.code||"error")+")",true)));
    unsubs.push(onSnapshot(collection(db,"claims"),snap=>{
      claimByChar={};snap.docs.forEach(d=>{const cid=(d.data()||{}).charId;if(cid&&!claimByChar[cid])claimByChar[cid]=d.id});
      renderCodes();
    },()=>{}));
    unsubs.push(onSnapshot(collection(db,"dmnotes"),snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=(d.data()||{}).text||""});
      const ta=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.dm;
      if(!ta){dmNotes=next;if(openId&&!sheetFocused())renderSheet()}
    },()=>{}));
  }else{
    openId=charId;
    unsubs.push(onSnapshot(doc(db,"characters",charId),snap=>{
      if(!snap.exists()){chars={};$("notice").innerHTML='<div class="note">Your sheet isn’t set up yet. Ask your DM.</div>';renderSheet();return}
      $("notice").innerHTML="";
      const remote={};remote[charId]=snap.data()||{};
      chars=mergeIncoming(remote);
      if(!sheetFocused()||!$("sheetHost").firstChild)renderSheet();
      setStatus("Live");
    },e=>{
      if(e&&e.code==="permission-denied")showGate("Your code no longer works. Ask your DM for a new one.");
      else setStatus("Sync problem ("+(e&&e.code||"error")+")",true);
    }));
  }
}

/* ---------- auth flow ---------- */
function showGate(msg){
  unsubs.forEach(u=>u());unsubs=[];
  chars={};openId=null;role=null;lvlUp=null;
  document.body.classList.remove("sheet-open");
  $("app").hidden=true;$("gate").hidden=false;$("sheetHost").innerHTML="";
  $("who").textContent="Not signed in";$("outBtn").hidden=!uid;
  const m=$("gateMsg");m.className="msg"+(msg?" err":"");m.textContent=msg||"";
}
async function enter(user){
  const tok=++enterTok;
  if(!user){uid=null;showGate();return}
  uid=user.uid;isAnon=user.isAnonymous;role=null;charId=null;
  try{await getDoc(doc(db,"config","dm"));role="dm"}catch(e){}
  if(!role){
    try{const m=await getDoc(doc(db,"members",uid));if(m.exists()&&m.data().charId){role="player";charId=m.data().charId}}catch(e){}
  }
  if(tok!==enterTok)return;
  if(!role){showGate(isAnon?"":"That Google account isn’t the DM account. Players: enter your character code.");return}
  startApp();
}
onAuthStateChanged(auth,user=>{enter(user)});

$("joinBtn").addEventListener("click",async()=>{
  const code=$("codeIn").value.trim().toLowerCase(),msg=$("gateMsg");
  const i=code.lastIndexOf("-");
  if(i<1){msg.className="msg err";msg.textContent="That doesn’t look like a character code. It looks like name-abc123.";return}
  msg.className="msg";msg.textContent="Opening…";
  try{
    if(!auth.currentUser)await signInAnonymously(auth);
    await setDoc(doc(db,"members",auth.currentUser.uid),{code:code,charId:code.slice(0,i),joinedAt:serverTimestamp()});
    msg.textContent="";
    await enter(auth.currentUser);
  }catch(e){
    msg.className="msg err";
    msg.textContent=(e&&e.code==="permission-denied")?"That code isn’t right. Check it with your DM.":"Could not open ("+(e&&e.code||"error")+").";
  }
});
$("codeIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("joinBtn").click()});
$("googleBtn").addEventListener("click",async()=>{
  const msg=$("gateMsg2");msg.className="msg";msg.textContent="";
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){msg.className="msg err";msg.textContent="Google sign-in failed ("+(e&&e.code||"error")+")."}
});
async function doSignOut(){
  if(isAnon&&!confirm("Sign out? You’ll need your character code to open your sheet again."))return;
  await signOut(auth);
}
$("outBtn").addEventListener("click",doSignOut);
</script>
</body>
