<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17665d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Sheets">
<title>Party Sheets</title>
<style>
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --ink:#17231f; --muted:#4f625c; --line:#c5d1cc;
  --accent:#17665d; --accent-ink:#ffffff; --brass:#8f6212;
  --hp-ok:#23804d; --hp-mid:#b87a0c; --hp-low:#b3312a; --chip:#e1eae6; --field:#ffffff; --react:#6b4aa8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101614; --panel:#19231f; --ink:#e8f0ed; --muted:#a3b5af; --line:#2f3e39;
    --accent:#52bdb0; --accent-ink:#071210; --brass:#e0aa4a;
    --hp-ok:#52cc87; --hp-mid:#e6ad45; --hp-low:#ee7068; --chip:#243029; --field:#121a17; --react:#b9a0f0;
  }
}
html{font-size:100%;-webkit-text-size-adjust:100%}
@media (min-width:701px) and (max-width:1100px){html{font-size:106.25%}}
@media (max-width:700px){html{font-size:112.5%}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 "Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 calc(5.7rem + env(safe-area-inset-bottom,0))}
body.nonav{padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:0;font-weight:700;letter-spacing:.01em}
button,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:1rem}
header.top{display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;justify-content:space-between;padding:.2rem 0 .6rem;border-bottom:3px solid var(--brass);margin-bottom:.8rem}
header.top>div:first-child{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
header.top h1{font-size:1.5rem}
.sub{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;padding:.1rem .65rem;border-radius:99px;background:var(--chip);font-size:.8rem;font-weight:700}
.badge.dm{background:var(--brass);color:#fff}
.badge.ok{background:var(--accent);color:var(--accent-ink)}
.btn{border:2px solid var(--line);background:var(--panel);padding:.5rem .95rem;border-radius:.7rem;font-weight:700;min-height:2.75rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:.3rem .7rem;font-size:.9rem;min-height:2.5rem}
.btn.danger{color:var(--hp-low)}
.btn.dmg{color:var(--hp-low);border-color:var(--hp-low)}
.btn.heal{color:var(--hp-ok);border-color:var(--hp-ok)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:.85rem;color:var(--muted)}
.status.err,.sub.err{color:var(--hp-low)}

/* ---------- DM party cards ---------- */
.ptools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem;align-items:center}
.ptools .btn{flex:1}
.ptools .grow{display:none}
.manage{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;margin-bottom:.9rem}
.manage>summary{min-height:2.9rem;display:flex;align-items:center;padding:0 1rem;font-weight:700;cursor:pointer}
.manage .inner{padding:0 1rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(21rem,1fr));gap:1rem}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}}
.pcard{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:1rem;padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.7rem}
.pcard.low{border-top-color:var(--hp-low)}
.pcard.mid{border-top-color:var(--hp-mid)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;background:none;border:0;padding:0;text-align:left;width:100%}
.pc-name{font-family:Georgia,serif;font-size:1.65rem;font-weight:700;line-height:1.1}
.pc-sub{color:var(--muted);font-size:.95rem;margin-top:.15rem}
.pc-open{font-size:.85rem;font-weight:700;color:var(--accent);white-space:nowrap;padding-top:.3rem}
.pc-hp{display:flex;flex-direction:column;gap:.45rem}
.pc-hprow{display:flex;align-items:flex-end;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.pc-hpnum{font-family:Georgia,serif;font-weight:700;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.pc-hpnum span{font-size:1.4rem;color:var(--muted);font-weight:600}
.pc-hpnum small{font-size:.95rem;color:var(--accent);font-family:inherit;margin-left:.3rem}
.pc-hpbtns{display:flex;gap:.4rem}
.pc-hpbtns .btn{min-width:3.1rem;font-size:1.05rem;padding:.3rem .5rem;min-height:2.9rem}
.hpbar{height:.9rem;border-radius:.5rem;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.hpbar>i{display:block;height:100%}
.pc-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;text-align:center}
.pc-stats div{background:var(--chip);border-radius:.6rem;padding:.35rem .1rem}
.pc-stats b{display:block;font-family:Georgia,serif;font-size:1.35rem;line-height:1.15;font-variant-numeric:tabular-nums}
.pc-stats span{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.pc-flags{display:flex;flex-wrap:wrap;gap:.4rem}
.flag{background:var(--chip);border-radius:.5rem;padding:.15rem .6rem;font-size:.9rem;font-weight:700}
.flag.bad{background:var(--hp-low);color:#fff}
.flag.good{background:var(--brass);color:#fff}
.pc-res{display:flex;flex-direction:column;gap:.35rem;border-top:1px dashed var(--line);padding-top:.6rem}
.slotline{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.slotline .lbl{min-width:3rem;font-size:.85rem;font-weight:700;color:var(--muted)}
.dots{display:inline-flex;gap:.3rem}
.dots i{width:1rem;height:1rem;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.chiprow{display:flex;flex-wrap:wrap;gap:.4rem}
.rchip{border:1px solid var(--line);background:var(--field);border-radius:.5rem;padding:.2rem .6rem;font-size:.9rem}
.rchip b{font-variant-numeric:tabular-nums}
.rchip.empty{opacity:.55}
.pc-upd{font-size:.8rem;color:var(--muted)}
.empty{padding:1.6rem;text-align:center;border:2px dashed var(--line);border-radius:1rem;color:var(--muted)}
.row{display:grid;gap:.7rem}
.cols4{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
label.f{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--muted);font-weight:700}
input[type=text],input[type=number],input[type=search],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;min-height:2.75rem}
textarea{min-height:5rem;resize:vertical}
input[type=checkbox]{width:1.4rem;height:1.4rem;accent-color:var(--accent)}

/* ---------- sheet ---------- */
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--cbh,0px));z-index:5;background:var(--panel);border:1px solid var(--line);border-bottom:3px solid var(--brass);border-radius:.9rem;margin-bottom:.8rem;padding:.4rem .6rem;display:flex;gap:.5rem;align-items:center;flex-wrap:nowrap}
.sbar .btn{white-space:nowrap;flex:0 0 auto}
.sbar-title{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.sbar-title .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar-title strong{font-family:Georgia,serif;font-size:1.3rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:.9rem}
.pane>h3{font-size:1.15rem;margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(21rem,1fr));gap:.9rem;align-items:start}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.ident{margin-bottom:.8rem;font-size:1.05rem;line-height:1.35}
.hero{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:1rem;padding:1rem;margin-bottom:.9rem}
.hero.low{border-top-color:var(--hp-low)}
.hero.mid{border-top-color:var(--hp-mid)}
.hero .hp-big{font-family:Georgia,serif;font-size:3.4rem;font-weight:700;line-height:1}
.hero .hp-big small{font-size:1.5rem;color:var(--muted)}
.hero .hp-big .tmp{font-size:1.05rem;color:var(--accent);font-family:inherit;font-weight:700}
.hero .hpbar{margin:.6rem 0;height:1.1rem}
.hpctl{display:grid;grid-template-columns:5.5rem 1fr 1fr;gap:.5rem;margin-top:.4rem}
.hpctl input{text-align:center;font-size:1.3rem;font-weight:700;min-height:3.2rem}
.hpctl .btn{min-height:3.2rem;font-size:1.1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.6rem,1fr));gap:.55rem;margin-bottom:.9rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:.55rem .3rem;text-align:center}
.tile b{display:block;font-family:Georgia,serif;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tile .ctl{display:flex;gap:.3rem;justify-content:center;margin-top:.2rem}
.tile .ctl .btn{min-width:2.5rem;padding:0}
.conds{color:var(--hp-low);font-weight:700}
.abil{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.2rem,1fr));gap:.55rem}
.ab{background:var(--chip);border-radius:.9rem;padding:.5rem .3rem;text-align:center}
.ab .nm{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.ab .md{font-size:2rem;font-weight:700;font-family:Georgia,serif;line-height:1.1}
.ab .sc{font-size:.95rem;color:var(--muted)}
.ab input{width:4.5rem;text-align:center;margin:0 auto;padding:.2rem;min-height:2.4rem}
.prof{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;font-size:1.02rem;border-bottom:1px dashed var(--line);min-height:2.75rem}
.prof .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.15rem}
.dot{width:1.1rem;text-align:center;color:var(--brass);font-weight:700}
.pip{width:2.1rem;height:2.1rem;border-radius:50%;border:3px solid var(--accent);background:transparent;padding:0}
.pip.used{background:var(--accent)}
.pips{display:flex;gap:.6rem;flex-wrap:wrap}
.slotrow{display:flex;align-items:center;gap:.7rem;padding:.45rem 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.slotrow .lv{min-width:4.6rem;font-weight:700}
.res{padding:.6rem 0;border-bottom:1px dashed var(--line)}
.res-h{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;margin-bottom:.4rem}
.res-h b{font-weight:700;font-size:1.05rem}
.counter{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.counter b{min-width:3.6rem;text-align:center;font-variant-numeric:tabular-nums;font-size:1.2rem}
.atk-card{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.atk-card b{font-size:1.1rem}
.atk-card .hit{font-weight:700;font-size:1.6rem;font-family:Georgia,serif;text-align:right;line-height:1}
.atk-card .dm2{grid-column:1/-1}
.atkedit{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:.4rem;margin-bottom:.7rem}
.atkedit>:nth-child(5){grid-column:1/-1}
details.entry,details.spell{border:1px solid var(--line);border-radius:.8rem;margin-bottom:.5rem;background:var(--field)}
details.entry>summary,details.spell>summary{list-style:none;cursor:pointer;padding:.7rem .9rem;min-height:3rem;display:block;font-weight:700;font-size:1.05rem;line-height:1.35}
details.entry>summary::-webkit-details-marker,details.spell>summary::-webkit-details-marker{display:none}
details.entry>summary::before,details.spell>summary::before{content:"▸";color:var(--brass);transition:transform .15s;display:inline-block;margin-right:.5rem}
details[open].entry>summary::before,details[open].spell>summary::before{transform:rotate(90deg)}
details.entry>.body,details.spell>.spell-body{padding:0 .9rem .9rem}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.entry-edit{border:1px solid var(--line);border-radius:.8rem;padding:.55rem;margin-bottom:.7rem;background:var(--field)}
.entry-edit .h{display:flex;gap:.4rem;margin-bottom:.4rem}
.entry-edit input{font-weight:700}
.lvl{background:var(--chip);border:3px solid var(--brass);border-radius:1rem;padding:1rem;margin-bottom:.9rem;display:flex;flex-direction:column;gap:.7rem}
.lvl h3{font-size:1.2rem}
.hist{font-size:.95rem;padding:.3rem 0;border-bottom:1px solid var(--line)}
.note{background:var(--chip);padding:.7rem 1rem;border-radius:.7rem;font-size:.95rem;margin-bottom:.8rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.codes{margin:1rem 0;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:0 1rem}
.codes>summary{min-height:2.9rem;display:flex;align-items:center;cursor:pointer;font-weight:700}
.coderow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.55rem 0;border-top:1px solid var(--line)}
.coderow .nm{flex:1 1 9rem;min-width:0}
.coderow code{font-size:1.05rem;background:var(--chip);padding:.2rem .6rem;border-radius:.4rem;user-select:all}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem;margin-top:.6rem}
.gatecard{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.gatecard h2{font-size:1.35rem}
.msg{font-size:.95rem;min-height:1.2em}
.msg.err{color:var(--hp-low)}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:3px solid var(--brass);padding-bottom:env(safe-area-inset-bottom,0)}
.bn-scroll{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative}
.bn-scroll::-webkit-scrollbar{display:none}
.bn-scroll.fit{overflow:hidden}
.bn-scroll.fit button{flex:1 1 0;min-width:0}
.bn-scroll button{flex:1 0 4.3rem;min-height:4.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;background:none;border:0;border-right:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--muted);position:relative;padding:.3rem .2rem}
.bn-scroll button:last-child{border-right:0}
.bn-scroll button.on{color:var(--accent-ink);background:var(--accent)}
.bn-scroll .ico{font-size:1.7rem;line-height:1.1}
.bn-scroll .n{position:absolute;top:.3rem;left:calc(50% + .7rem);background:var(--hp-low);color:#fff;border-radius:99px;font-size:.75rem;min-width:1.3rem;padding:0 .35rem;line-height:1.3rem;font-weight:700}
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding:.35rem 0 .5rem;margin-bottom:.4rem;background:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:.5rem}
.seg.two{grid-template-columns:repeat(2,1fr);margin-bottom:.7rem}
.seg button{min-height:3rem;border-radius:.8rem;border:2px solid var(--line);background:var(--panel);font-weight:700;font-size:1.02rem}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips-row{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding-bottom:.1rem}
.chips-row::-webkit-scrollbar{display:none}
.chips-row .chip{flex:0 0 auto}
.lk-bar{display:grid;grid-template-columns:1fr;gap:.5rem;margin-bottom:.5rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.4rem;scrollbar-width:thin}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--panel);border-radius:99px;padding:.35rem .95rem;font-size:.95rem;font-weight:700;min-height:2.6rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lk-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.5rem;margin-bottom:.6rem}
.sd-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.4rem .8rem;margin-bottom:.6rem}
.sd-meta span{display:block;font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.spell>summary .sub{font-weight:400}
.thread{display:flex;flex-direction:column;gap:.5rem;max-height:56vh;overflow-y:auto;padding:.2rem;margin-bottom:.7rem}
.bub{max-width:88%;padding:.55rem .85rem;border-radius:1rem;background:var(--chip);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub .t{font-size:.75rem;opacity:.8;margin-top:.1rem}
.composer{display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{min-height:3.2rem}
.comp{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--brass);border-radius:1rem;padding:.9rem;margin-bottom:.9rem}
.comp-h{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.2rem}
.comp-h h3{font-size:1.35rem}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem;text-align:center;margin:.6rem 0}
.mini div{background:var(--chip);border-radius:.6rem;padding:.3rem 0;font-size:.82rem}
.mini b{display:block;font-size:1.05rem}
.tome-bar{display:flex;gap:.5rem;align-items:center;justify-content:space-between;margin:.2rem 0 .6rem}
#tome{min-height:50vh}
#tome[data-view="combat"] .tome-meta,#tome[data-view="monsters"] .tome-meta,#tome[data-view="more"] .tome-meta,#tome[data-view="combat"] .actbar,#tome[data-view="monsters"] .actbar,#tome[data-view="more"] .actbar{display:none!important}
.legal{font-size:.8rem;color:var(--muted);margin-top:1rem}
@media (max-width:700px){
  .wrap{padding:.7rem}
  header.top h1{font-size:1.3rem}
  body.compact header.top{display:none}
  .pc-stats{gap:.3rem}
  .atkedit{grid-template-columns:1fr 2fr auto}
  .atkedit>:nth-child(1){grid-column:1/3;grid-row:1}
  .atkedit>:nth-child(4){grid-column:3;grid-row:1}
  .atkedit>:nth-child(2){grid-column:1;grid-row:2}
  .atkedit>:nth-child(3){grid-column:2/4;grid-row:2}
  .atkedit>:nth-child(5){grid-column:1/-1;grid-row:3}
  .atkedit>:nth-child(n+6){grid-column:1/-1;grid-row:auto}
  .cols4{grid-template-columns:repeat(2,1fr)}
}

/* ---------- Play tab: your turn ---------- */
.play-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:.9rem;align-items:start}
@media (max-width:900px){.play-grid{grid-template-columns:1fr}}
.turn{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:.9rem}
.turn>h3{font-size:1.4rem}
.turn-sum{color:var(--muted);font-size:.98rem;margin:.2rem 0 .4rem}
.tsec{border-left:7px solid var(--accent);padding:.1rem 0 .2rem .8rem;margin:1.1rem 0}
.tsec.bonus{border-left-color:var(--brass)}
.tsec.reaction{border-left-color:var(--react)}
.tsec.free{border-left-color:var(--muted)}
.tsec.other{border-left-color:var(--line)}
.tsec-h{display:flex;align-items:baseline;gap:.2rem .7rem;flex-wrap:wrap;margin-bottom:.3rem}
.tsec-h b{font-family:Georgia,serif;font-size:1.45rem}
.tsec.action .tsec-h b{color:var(--accent)}
.tsec.bonus .tsec-h b{color:var(--brass)}
.tsec.reaction .tsec-h b{color:var(--react)}
.tsec-h span{font-size:.88rem;color:var(--muted)}

  s.alignment=j.alignment||"";s.size=j.size||"";s.level=Number(j.level)||1;s.background=j.background||"";
  const st=j.stats||[];
  ABIL.forEach((k,i)=>{if(st[i]!=null)s.abilities[k]=Number(st[i])});
  s.ac=Number(j.ac)||10;s.speed=parseInt(j.speed,10)||30;
  s.hpMax=Number(j.hp_max!=null?j.hp_max:j.hp)||10;
  s.hp=Number(j.hp_current!=null?j.hp_current:s.hpMax);
  s.hpTemp=Number(j.hp_temp)||0;s.hitDice=j.hit_dice||"";
  s.inspiration=Number(j.inspiration)||0;
  const pb=Number(j.proficiency)||prof(s.level);
  (j.saves||[]).forEach(t=>{
    const m=/^\s*([A-Za-z]+)/.exec(t);if(!m)return;
    const k=m[1].toLowerCase().slice(0,3);
    if(ABIL.indexOf(k)>=0)s.saveProf[k]=true;
  });
  (j.skills||[]).forEach(t=>{
    const m=/^(.*?)\s*([+-]\d+)\s*$/.exec(t);if(!m)return;
    const sk=SKILLS.filter(x=>x[0].toLowerCase()===m[1].trim().toLowerCase())[0];if(!sk)return;
    const diff=Number(m[2])-mod(s.abilities[sk[1]]);
    const lv=Math.max(0,Math.min(2,Math.floor(diff/pb)));
    const extra=diff-lv*pb;
    if(lv)s.skillProf[sk[0]]=lv;
    if(extra)s.skillExtra[sk[0]]=extra;
  });
  const info=classInfo(s.cls);
  if(info&&info.ab)s.spellAbility=info.ab;
  s.slots=slotsFor(info,s.level);
  s.languages=(j.languages||[]).join(", ");
  s.spells=(j.spells||[]).map(t=>{
    const nm=String(t).trim(),cant=/cantrip/i.test(nm);
    const clean=nm.replace(/\s*\([^)]*cantrip[^)]*\)/i,"").trim();
    let lv=cant?0:(levelOf?levelOf(clean):-1);if(lv==null)lv=-1;
    return {name:clean,level:lv,desc:""};
  });
  s.spellInfo=(j.spellcasting||[]).map(e=>({name:e.name||"",desc:e.desc||""}));
  const actionNames={};
  (j.actions||[]).forEach(a=>{
    const desc=a.desc||"";
    actionNames[String(a.name||"").toLowerCase()]=1;
    const hit=/([+-]\d+)\s+to hit/i.exec(desc);
    if(hit){
      const d=/Hit:\s*([^.]+?)\.(.*)$/i.exec(desc);
      s.attacks.push({name:a.name||"",bonus:hit[1],dmg:d?d[1].trim():"",notes:d?d[2].trim():""});
    }else s.actions.push({name:a.name||"",desc:desc});
  });
  const dmParts=[];
  (j.class_features||[]).forEach(f=>{
    const nm=f.name||"";
    if(/DM NOTE/i.test(nm)){dmParts.push(nm+": "+(f.desc||""));return}
    if(actionNames[nm.toLowerCase()])return;
    s.features.push({name:nm,desc:f.desc||""});
  });
  (j.traits||[]).forEach(t=>s.traits.push({name:t.name||"",desc:t.desc||""}));
  s.goals=(j.goals||[]).join("\n");
  s.backstory=j.backstory||"";
  const inv=[];
  (j.equipment||[]).forEach(line=>{
    const g=/^\s*(\d+)\s*gp\b[,\s]*(.*)$/i.exec(line);
    if(g){s.gold=Number(g[1]);if(g[2])inv.push(g[2])}
    else inv.push(line);
  });
  s.inventory=inv.join("\n");
  const die=info?info.die:8;
  s.resources=[{name:"Hit Dice (d"+die+")",max:s.level,used:0,reset:"hitdice"}];
  if(j.notes)dmParts.unshift(j.notes);
  s.updated=Date.now();
  return {sheet:s,dm:dmParts.join("\n\n"),companions:[]};
}

/* ================= saving ================= */
const pend={};
function queueWrite(key,ref,get,keys){
  const p=pend[key]||(pend[key]={keys:new Set()});
  p.ref=ref;p.get=get;keys.forEach(k=>p.keys.add(k));p.keys.add("updated");
  const o=get();if(o)o.updated=Date.now();
  clearTimeout(p.timer);p.timer=setTimeout(()=>flush(key),700);
  setStatus("Saving…");
}
async function flush(key){
  const p=pend[key];if(!p||!p.keys.size)return;
  const o=p.get();if(!o)return;
  if(p.busy){p.timer=setTimeout(()=>flush(key),300);return}
  const keys=Array.from(p.keys);p.keys=new Set();p.busy=true;
  const data={};keys.forEach(k=>{data[k]=o[k]===undefined?null:o[k]});
  try{
    const pr=setDoc(p.ref,data,{mergeFields:keys});
    if(!navigator.onLine){pr.catch(()=>{});setStatus("Offline: saved on this device, will sync later");return}
    const r=await Promise.race([pr,new Promise(res=>setTimeout(()=>res("slow"),8000))]);
    if(r==="slow"){pr.catch(()=>{});setStatus("Slow connection: saved here, syncing…");return}
    if(!p.keys.size)setStatus("Saved");
  }
  catch(e){keys.forEach(k=>p.keys.add(k));setStatus("Could not save ("+(e&&e.code||"error")+")",true)}
  finally{p.busy=false}
}
const saveChar=(id,keys)=>queueWrite("c:"+id,doc(db,"characters",id),()=>chars[id],keys);
const saveComp=(cid,pid,keys)=>queueWrite("p:"+cid+"/"+pid,doc(db,"characters",cid,"companions",pid),()=>companions[cid]&&companions[cid][pid],keys);
function keepLocal(prefix,id,remote,local){
  const p=pend[prefix+id];
  if(p&&p.keys&&p.keys.size&&local)p.keys.forEach(k=>{remote[k]=local[k]});
  return remote;
}
let noteTimers={};
function queueNote(id){

  noteTimers[id]=setTimeout(async()=>{

}

function loadSpells(){
  if(spellDB)return Promise.resolve();
  if(!spellLoad)spellLoad=fetch("spells-2024.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(a=>{
    spellDB=a;spellIdx=new Map(a.map(s=>[s.n.toLowerCase(),s]));

function findSpell(name){

  if(c)return Object.assign({},c,{u:2});

function lookupResults(){
  const base=(spellDB||[]).concat(customSpells.map(c=>Object.assign({},c,{u:2})));
  const q=lk.q.trim().toLowerCase();
  const res=base.filter(s=>{
    if(lk.lv!=="any"&&s.l!==Number(lk.lv))return false;
    if(lk.cls!=="any"&&!(s.cl||[]).some(c=>c===lk.cls))return false;
    if(lk.sch!=="any"&&s.s!==lk.sch)return false;
    if(lk.conc&&!s.k)return false;
    if(lk.rit&&!s.i)return false;
    if(q&&s.n.toLowerCase().indexOf(q)<0&&String(s.x).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  res.sort((a,b)=>{
    if(q){const ai=a.n.toLowerCase().indexOf(q)===0?0:a.n.toLowerCase().indexOf(q)>0?1:2,bi=b.n.toLowerCase().indexOf(q)===0?0:b.n.toLowerCase().indexOf(q)>0?1:2;if(ai!==bi)return ai-bi}
    return a.n.localeCompare(b.n);
  });
  return res;
}

const CONDS=[{"n":"Blinded","i":"👁","s":"Can't see and fail any check that needs sight. Attacks against you have Advantage, and your attacks have Disadvantage.","e":["Can't See. You can't see and automatically fail any ability check that requires sight.","Attacks Affected. Attack rolls against you have Advantage, and your attack rolls have Disadvantage."]},{"n":"Charmed","i":"💕","s":"Can't attack the charmer or target them with harmful effects. The charmer has Advantage on social checks against you.","e":["Can't Harm the Charmer. You can't attack the charmer or target the charmer with damaging abilities or magical effects.","Social Advantage. The charmer has Advantage on ability checks to interact socially with you."]},{"n":"Deafened","i":"🔇","s":"Can't hear and fail any check that needs hearing.","e":["Can't Hear. You can't hear and automatically fail any ability check that requires hearing."]},{"n":"Exhaustion","i":"😴","s":"Each level: −2 to every D20 Test and −5 ft Speed. Level 6 is death. A long rest removes 1 level.","e":["Exhaustion Levels. This condition is cumulative. Each time you receive it, you gain 1 Exhaustion level. You die if your Exhaustion level is 6.","D20 Tests Affected. When you make a D20 Test, the roll is reduced by 2 times your Exhaustion level.","Speed Reduced. Your Speed is reduced by a number of feet equal to 5 times your Exhaustion level.","Removing Exhaustion Levels. Finishing a Long Rest removes 1 of your Exhaustion levels. When your Exhaustion level reaches 0, the condition ends."]},{"n":"Frightened","i":"😨","s":"Disadvantage on checks and attacks while you can see the source of fear. You can't willingly move closer to it.","e":["Ability Checks and Attacks Affected. You have Disadvantage on ability checks and attack rolls while the source of fear is within line of sight.","Can't Approach. You can't willingly move closer to the source of your fear."]},{"n":"Grappled","i":"🤼","s":"Speed 0. Disadvantage on attacks against anyone except the grappler, who can drag you along.","e":["Speed 0. Your Speed is 0 and can't increase.","Attacks Affected. You have Disadvantage on attack rolls against any target other than the grappler.","Movable. The grappler can drag or carry you when it moves, but every foot of movement costs it 1 extra foot unless you are Tiny or two or more sizes smaller."]},{"n":"Incapacitated","i":"💫","s":"No actions, bonus actions or reactions. Concentration breaks. You can't speak.","e":["Inactive. You can't take any action, Bonus Action, or Reaction.","No Concentration. Your Concentration is broken.","Speechless. You can't speak.","Surprised. If you're Incapacitated when you roll Initiative, you have Disadvantage on the roll."]},{"n":"Invisible","i":"👻","s":"Attacks against you have Disadvantage and yours have Advantage. Effects that need to see you can't target you. Advantage on initiative.","e":["Surprise. If you're Invisible when you roll Initiative, you have Advantage on the roll.","Concealed. You aren't affected by any effect that requires its target to be seen unless the effect's creator can somehow see you. Any equipment you are wearing or carrying is also concealed.","Attacks Affected. Attack rolls against you have Disadvantage, and your attack rolls have Advantage. If a creature can somehow see you, you don't gain this benefit against that creature."]},{"n":"Paralyzed","i":"⚡","s":"Incapacitated, Speed 0. Auto-fail Str and Dex saves. Attacks against you have Advantage, and hits from within 5 ft are critical hits.","e":["Incapacitated. You have the Incapacitated condition.","Speed 0. Your Speed is 0 and can't increase.","Saving Throws Affected. You automatically fail Strength and Dexterity saving throws.","Attacks Affected. Attack rolls against you have Advantage.","Automatic Critical Hits. Any attack roll that hits you is a Critical Hit if the attacker is within 5 feet of you."]},{"n":"Petrified","i":"🗿","s":"Turned to stone: Incapacitated, Speed 0, Resistance to all damage, immune to Poisoned. Auto-fail Str and Dex saves. Attacks against you have Advantage.","e":["Turned to Inanimate Substance. You are transformed, along with any nonmagical objects you are wearing and carrying, into a solid inanimate substance (usually stone). Your weight increases by a factor of ten, and you cease aging.","Incapacitated. You have the Incapacitated condition.","Speed 0. Your Speed is 0 and can't increase.","Attacks Affected. Attack rolls against you have Advantage.","Saving Throws Affected. You automatically fail Strength and Dexterity saving throws.","Resist Damage. You have Resistance to all damage.","Poison Immunity. You have Immunity to the Poisoned condition.","Saving Throws Affected. You automatically fail Strength and Dexterity saving throws.","Resist Damage. You have Resistance to all damage.","Poison Immunity. You have Immunity to the Poisoned condition."]},{"n":"Poisoned","i":"☠","s":"Disadvantage on attack rolls and ability checks.","e":["Ability Checks and Attacks Affected. You have Disadvantage on attack rolls and ability checks."]},{"n":"Prone","i":"🛌","s":"You crawl, or spend half your Speed to stand up. Disadvantage on your attacks. Attacks against you have Advantage from within 5 ft, otherwise Disadvantage.","e":["Restricted Movement. Your only movement options are to crawl or to spend an amount of movement equal to half your Speed (round down) to right yourself and thereby end the condition. If your Speed is 0, you can't right yourself.","Attacks Affected. You have Disadvantage on attack rolls. An attack roll against you has Advantage if the attacker is within 5 feet of you. Otherwise, that attack roll has Disadvantage."]},{"n":"Restrained","i":"⛓","s":"Speed 0. Attacks against you have Advantage and yours have Disadvantage. Disadvantage on Dex saves.","e":["Speed 0. Your Speed is 0 and can't increase.","Attacks Affected. Attack rolls against you have Advantage, and your attack rolls have Disadvantage.","Saving Throws Affected. You have Disadvantage on Dexterity saving throws."]},{"n":"Stunned","i":"😵","s":"Incapacitated. Auto-fail Str and Dex saves. Attacks against you have Advantage.","e":["Incapacitated. You have the Incapacitated condition.","Saving Throws Affected. You automatically fail Strength and Dexterity saving throws.","Attacks Affected. Attack rolls against you have Advantage."]},{"n":"Unconscious","i":"💤","s":"Incapacitated and Prone, you drop what you hold, Speed 0, unaware. Auto-fail Str and Dex saves. Attacks have Advantage, and hits from within 5 ft are critical hits.","e":["Inert. You have the Incapacitated and Prone conditions, and you drop whatever you're holding.","**When this condition ends, you remain Prone.","Speed 0. Your Speed is 0 and can't increase.","Attacks Affected. Attack rolls against you have Advantage.","Saving Throws Affected. You automatically fail Strength and Dexterity saving throws.","Automatic Critical Hits. Any attack roll that hits you is a Critical Hit if the attacker is within 5 feet of you.","Unaware. You're unaware of your surroundings."]}];
const INCAP=["Incapacitated","Paralyzed","Petrified","Stunned","Unconscious"];
const SPEED0=["Grappled","Restrained","Paralyzed","Petrified","Unconscious"];
let statOpen={};
const condDef=n=>CONDS.filter(x=>x.n===n)[0];
const canonCond=n=>{const d=CONDS.filter(x=>x.n.toLowerCase()===String(n).trim().toLowerCase())[0];return d?d.n:null};
const condList=c=>String(c.conditions||"").split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
const activeStd=c=>condList(c).map(canonCond).filter(n=>n&&n!=="Exhaustion").filter((v,i,a)=>a.indexOf(v)===i);
const customConds=c=>condList(c).filter(x=>!canonCond(x));
function effSpeed(c){
  const z=activeStd(c).filter(x=>SPEED0.indexOf(x)>=0)[0];
  if(z)return {v:0,why:z};
  const ex=Number(c.exhaustion)||0;
  return {v:Math.max(0,(Number(c.speed)||0)-5*ex),why:ex?"Exhaustion "+ex:""};
}
function noActionsWhy(c){
  const a=activeStd(c).filter(x=>INCAP.indexOf(x)>=0)[0];
  if(a)return "You are "+a+": you can’t take actions, bonus actions or reactions, and your Concentration is broken.";
  if(c.hp===0&&!c.npc)return "You are at 0 HP and Unconscious: no actions. Make a death save at the start of your turn.";
  if((c.exhaustion||0)>=6)return "Exhaustion level 6 is death.";
  return "";
}
const conSave=c=>mod(c.abilities.con)+(c.saveProf&&c.saveProf.con?prof(c.level):0);
let htT;
function hostToast(msg,ms){
  let t=$("htoast");
  if(!t){t=document.createElement("div");t.id="htoast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("on");clearTimeout(htT);htT=setTimeout(()=>t.classList.remove("on"),ms||8000);
}
/* call after damage was applied. Ends concentration at 0 HP, otherwise shows the save to make. */
function concAfter(id,taken){
  const c=chars[id];if(!c||!c.concentrating||!(taken>0))return;
  const nm=(c.name||"").split(" ")[0];
  if(c.hp===0){const sp=c.concentrating;c.concentrating="";hostToast(nm+" dropped to 0 HP, so concentration on "+sp+" ends.");return}
  const dc=Math.min(30,Math.max(10,Math.floor(taken/2)));
  hostToast("Concentration check: "+nm+" took "+taken+" damage. Constitution save DC "+dc+" ("+sgn(conSave(c))+" for "+nm+") or lose "+c.concentrating+".",10000);
}
function concSpellOptions(c){
  const all=c.spells.filter(s=>s.level>0);
  const conc=spellDB?all.filter(s=>{const sp=findSpell(s.name);return sp&&sp.k}):[];
  const list=(conc.length?conc:all).map(s=>s.name);
  return list;
}
function statusPanel(id,c,can,compact){
  const act=activeStd(c),cust=customConds(c),ex=Number(c.exhaustion)||0;
  let h='<div class="stat" data-id="'+E(id)+'">';
  /* conditions */
  h+='<div class="stat-row"><b class="stat-k">Conditions</b><div class="stat-v">';
  if(!act.length&&!cust.length)h+='<span class="sub">None right now.</span>';
  act.forEach(n=>{h+=(can?'<button type="button" class="cchip on" data-act="ctoggle" data-n="'+n+'" aria-label="Remove '+n+'">'+condDef(n).i+' '+n+' ✕</button>':'<span class="cchip on">'+condDef(n).i+' '+n+'</span>')});
  cust.forEach(n=>{h+='<span class="cchip on">'+E(n)+'</span>'});
  h+='</div></div>';
  if(can){
    h+='<details class="cpick"><summary>＋ Add or remove a condition</summary><div class="cgrid">'+
      CONDS.filter(x=>x.n!=="Exhaustion").map(x=>'<button type="button" class="cchip'+(act.indexOf(x.n)>=0?" on":"")+'" data-act="ctoggle" data-n="'+x.n+'" aria-pressed="'+(act.indexOf(x.n)>=0)+'">'+x.i+' '+x.n+'</button>').join("")+'</div></details>';
  }
  act.forEach(n=>{
    const d=condDef(n);
    h+='<div class="ceff"><b>'+E(n)+'.</b> '+E(d.s)+(compact?"":'<details class="more"><summary>Full rules</summary><div class="prose">'+d.e.map(E).join("\n\n")+'</div></details>')+'</div>';
  });
  /* exhaustion */
  h+='<div class="stat-row"><b class="stat-k">Exhaustion</b><div class="stat-v"><div class="stepper">'+
    (can?'<button type="button" class="btn small" data-act="exh" data-d="-1" aria-label="Remove one level of exhaustion"'+(ex<=0?" disabled":"")+'>−</button>':"")+
    '<b>Level '+ex+'</b>'+
    (can?'<button type="button" class="btn small" data-act="exh" data-d="1" aria-label="Add one level of exhaustion"'+(ex>=6?" disabled":"")+'>+</button>':"")+'</div></div></div>';
  if(ex>0)h+='<div class="ceff"><b>Exhaustion '+ex+'.</b> Every D20 Test (attack, check or save) is reduced by <b>'+(2*ex)+'</b>. Speed is reduced by <b>'+(5*ex)+' ft</b>'+(ex>=6?'. <b>Level 6 is death.</b>':'. A long rest removes 1 level.')+'</div>';
  /* concentration */
  h+='<div class="stat-row"><b class="stat-k">Concentration</b><div class="stat-v">';
  if(c.concentrating){
    h+='<span class="cchip conc">◉ '+E(c.concentrating)+'</span>'+(can?'<button type="button" class="btn small" data-act="concend">End it</button>':"");
  }else if(can){
    const opts=concSpellOptions(c);
    h+='<select data-conc-pick aria-label="Spell you are concentrating on">'+opts.map(n=>'<option>'+E(n)+'</option>').join("")+'<option value="__other">Other…</option></select><button type="button" class="btn small" data-act="conc">Start</button>';
  }else h+='<span class="sub">Not concentrating.</span>';
  h+='</div></div>';
  if(c.concentrating)h+='<div class="ceff"><b>Remember.</b> Every time you take damage, make a Constitution save (<b>'+sgn(conSave(c))+'</b> for you). The DC is 10 or half the damage, whichever is higher. You lose the spell on a fail, if you are Incapacitated or die, or if you start concentrating on another spell.</div>';
  return h+'</div>';
}

function remoteNotes(p,c){
  if(!p||!c)return;
  if(c.hp<p.hp&&p.concentrating&&c.concentrating){
    const taken=(p.hp-c.hp)+Math.max(0,(p.hpTemp||0)-(c.hpTemp||0)),dc=Math.min(30,Math.max(10,Math.floor(taken/2)));
    hostToast("You took "+taken+" damage. Concentration check on "+c.concentrating+": Constitution save DC "+dc+" ("+sgn(conSave(c))+").",12000);
  }else if(p.concentrating&&!c.concentrating)hostToast("Concentration on "+p.concentrating+" has ended.");
  if(p.conditions!==c.conditions||p.exhaustion!==c.exhaustion){
    const l=activeStd(c).concat(customConds(c)).concat(c.exhaustion?["Exhaustion "+c.exhaustion]:[]);
    hostToast("Your status changed: "+(l.length?l.join(", "):"no conditions")+".",9000);
  }
}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.classList&&d.classList.contains("cstat"))statOpen[d.dataset.id]=d.open},true);
/* ================= DM: party ================= */
function hpColor(c){const r=c.hpMax>0?c.hp/c.hpMax:0;return r>.5?"var(--hp-ok)":r>.25?"var(--hp-mid)":"var(--hp-low)"}
function hpClass(c){const r=c.hpMax>0?c.hp/c.hpMax:0;return r<=.25?"low":r<=.5?"mid":""}
function unreadFrom(cid,who){return (messages[cid]||[]).filter(m=>m.from===who&&!(who==="player"?m.readByDM:m.readByPlayer)).length}
const ord=n=>n+(n===1?"st":n===2?"nd":n===3?"rd":"th");
const shortRes=n=>String(n||"").replace(/\s*\(.*\)\s*$/,"").trim();
function slotLines(c){
  const lv=Object.keys(c.slots).map(Number).filter(l=>c.slots[l].max>0).sort((a,b)=>a-b);
  return lv.map(l=>{const t=c.slots[l];let d="";for(let i=0;i<t.max;i++)d+='<i class="'+(i<t.max-t.used?"on":"")+'"></i>';
    return '<div class="slotline"><span class="lbl">'+ord(l)+'</span><span class="dots" role="img" aria-label="'+(t.max-t.used)+' of '+t.max+' level '+l+' slots left">'+d+'</span></div>'}).join("");
}
function resChips(c){
  return c.resources.map(r=>{const left=Math.max(0,r.max-r.used);return '<span class="rchip'+(left?"":" empty")+'">'+E(shortRes(r.name))+' <b>'+left+'/'+r.max+'</b></span>'}).join("");
}
/* ---- DM party: abilities at a glance ---- */
const ABIL_UP={str:"STR",dex:"DEX",con:"CON",int:"INT",wis:"WIS",cha:"CHA"};
let partyView="cards", showAbil=true;
try{partyView=localStorage.getItem("partyView")||"cards";showAbil=localStorage.getItem("showAbil")!=="0"}catch(e){}
function saveInfo(c){
  const pb=prof(c.level),adv={};
  const txt=(c.traits||[]).concat(c.features||[]).map(e=>(e.name||"")+" "+(e.desc||"")).join(" ").toLowerCase();
  if(txt.indexOf("gnomish cunning")>=0){adv.int=adv.wis=adv.cha=true}
  if(txt.indexOf("danger sense")>=0)adv.dex=true;
  return ABIL.map(k=>({k:k,v:mod(c.abilities[k])+(c.saveProf[k]?pb:0),p:!!c.saveProf[k],a:!!adv[k]}));
}
function sensesOf(c){
  const texts=(c.traits||[]).concat(c.features||[]).concat(c.actions||[]).map(e=>(e.name||"")+" "+(e.desc||""));
  let dv=0;
  texts.forEach(t=>{const re=/darkvision/ig;let m;while((m=re.exec(t))){const n=/(\d+)\s*(?:ft|feet)/i.exec(t.slice(m.index,m.index+90));if(n)dv=Math.max(dv,Number(n[1]))}});
  const devil=(c.features||[]).some(e=>/devil.s sight/i.test(e.name||""));
  return (dv?dv+" ft":"none")+(devil?" + Devil’s Sight 120 ft":"");
}
const passiveOf=(c,name)=>{const s=SKILLS.filter(x=>x[0]===name)[0];return 10+skillTotal(c,s)};
function profSkills(c){return SKILLS.filter(s=>(Number(c.skillProf[s[0]])||0)>0||(Number(c.skillExtra[s[0]])||0)>0).map(s=>s[0]+" "+sgn(skillTotal(c,s))).join(", ")||"none"}
const HEALRE=/^(cure wounds|healing word|mass healing word|mass cure wounds|prayer of healing|heal|goodberry|aid|lesser restoration|greater restoration|regenerate|revivify|healing spirit|life transference)$/i;
function spellMark(sp){
  if(!sp)return "";
  const t=String(sp.t||"").toLowerCase();
  return (t.indexOf("bonus")===0?"B":t.indexOf("reaction")===0?"R":"")+(sp.k?"C":"");
}
function abChip(txt,left,max){
  const out=max!=null&&left<=0;
  return '<span class="ab-chip'+(out?" out":"")+'">'+E(txt)+(max!=null?' <b>'+left+'/'+max+'</b>':"")+'</span>';
}
function abilityBlock(c,id){
  const rows=[];
  const row=(cls,k,inner)=>{if(inner)rows.push('<div class="ab-row r-'+cls+'"><span class="ab-k">'+k+'</span><div class="ab-v">'+inner+'</div></div>')};
  row("atk","Attacks",c.attacks.map(a=>{
    const fx=String(a.extra||"").split("\n").map(x=>(/^([^:]{2,40}):/.exec(x.trim())||[])[1]).filter(Boolean);
    return '<div class="ab-atk"><b>'+E(a.name||"Attack")+'</b> <span class="ab-hit">'+E(a.bonus)+'</span> '+E(a.dmg)+(fx.length?' <span class="sub">('+E(fx.join(", "))+')</span>':"")+'</div>';
  }).join(""));
  const by={action:[],bonus:[],reaction:[],free:[],other:[]};
  c.actions.forEach(e=>{by[actType(e)].push(e)});
  const chip=e=>{const ri=resIndex(c,e.res),r=ri>=0?c.resources[ri]:null;return abChip(String(e.name).replace(/\s*\((Channel Divinity|Chef|free cast)\)\s*$/i,""),r?Math.max(0,r.max-r.used):0,r?r.max:null)};
  const bk=spellBuckets(c);
  const sp=(arr)=>arr.map(x=>'<span class="ab-chip sp">'+E(x.s.name)+(spellMark(x.sp)?'<sup>'+spellMark(x.sp)+'</sup>':"")+'</span>').join("");
  row("act","Action",by.action.map(chip).join(""));
  row("bonus","Bonus",by.bonus.map(chip).join("")+sp(bk.bonus.filter(x=>x.s.level>=0)));
  row("react","Reaction",by.reaction.map(chip).join("")+sp(bk.reaction));
  row("free","On a hit",by.free.map(chip).join(""));
  row("oth","Rests",by.other.map(chip).join(""));
  const lv={};
  c.spells.forEach(s=>{(lv[s.level]=lv[s.level]||[]).push({s:s,sp:findSpell(s.name)})});
  Object.keys(lv).map(Number).sort((a,b)=>a-b).forEach(l=>{
    row("spl",l===0?"Cantrips":"Level "+l,lv[l].map(x=>'<span class="ab-chip sp">'+E(x.s.name)+(spellMark(x.sp)?'<sup>'+spellMark(x.sp)+'</sup>':"")+'</span>').join(""));
  });
  const named=new Set(c.actions.map(e=>String(e.name).toLowerCase()));
  const feats=(c.features||[]).filter(f=>!/ability score|^personality|special notes/i.test(f.name)).map(f=>String(f.name).replace(/\s*\(.*?\)\s*$/,"").replace(/^[^:]+:\s*/,""))
    .filter(n=>!Array.from(named).some(x=>x.indexOf(n.toLowerCase().slice(0,10))>=0||n.toLowerCase().indexOf(x.slice(0,10))>=0));
  if(feats.length)row("feat","Also has",feats.slice(0,9).map(n=>'<span class="ab-chip plain">'+E(n)+'</span>').join("")+(feats.length>9?' <span class="sub">+'+(feats.length-9)+' more</span>':""));
  const comps=Object.keys(companions[id]||{}).map(pid=>companions[id][pid]);
  if(comps.length)row("comp","Pets",comps.map(p=>'<span class="ab-chip">'+E(p.name)+' <b>'+p.hp+'/'+p.hpMax+'</b> · AC '+E(p.ac)+(p.visible?"":" (hidden)")+'</span>').join(""));
  return rows.length?'<div class="pc-abil">'+rows.join("")+'</div>':"";
}
function applyHpDelta(c,d){
  if(d<0){let rem=-d;const t=Math.min(c.hpTemp||0,rem);c.hpTemp=(c.hpTemp||0)-t;rem-=t;c.hp=Math.max(0,c.hp-rem);return -d}
  else{if(c.hp===0&&d>0){c.deathS=0;c.deathF=0}c.hp=Math.min(c.hpMax,c.hp+d);return 0}
}
function pcard(id){
  const c=chars[id],pct=c.hpMax>0?Math.max(0,Math.min(100,Math.round(c.hp/c.hpMax*100))):0,st=spellStats(c),un=unreadFrom(id,"player");
  const first=(c.name||"Unnamed").split(" ")[0];
  const who=c.npc?"NPC":(c.player||"");
  const sub=[c.race,(c.cls||"")+(c.level?" "+c.level:"")].filter(Boolean).join(" · ")+(who?" · "+who:"");
  let flags="";
  if(c.hp===0&&!c.npc)flags+='<span class="flag bad">Down · saves ✓'+c.deathS+' ✗'+c.deathF+'</span>';
  activeStd(c).forEach(n=>{flags+='<span class="flag bad" title="'+E(condDef(n).s)+'">'+condDef(n).i+' '+n+'</span>'});
  customConds(c).forEach(n=>{flags+='<span class="flag bad">'+E(n)+'</span>'});
  if(c.exhaustion)flags+='<span class="flag bad">😴 Exhaustion '+c.exhaustion+'</span>';
  if(c.concentrating)flags+='<span class="flag conc">◉ '+E(c.concentrating)+'</span>';
  if(c.inspiration)flags+='<span class="flag good">★ Inspiration'+(c.inspiration>1?" ×"+c.inspiration:"")+'</span>';
  const slots=slotLines(c);
  const linked=new Set();c.actions.forEach(e=>{const i=resIndex(c,e.res);if(i>=0)linked.add(i)});
  const chips=c.resources.map((r,i)=>[r,i]).filter(x=>!(showAbil&&linked.has(x[1]))).map(x=>{const left=Math.max(0,x[0].max-x[0].used);return '<span class="rchip'+(left?"":" empty")+'">'+E(shortRes(x[0].name))+' <b>'+left+'/'+x[0].max+'</b></span>'}).join("");
  return '<article class="pcard '+hpClass(c)+'" data-id="'+E(id)+'">'+
    '<button class="pc-head" data-act="open" aria-label="Open '+E(first)+'’s sheet"><div><div class="pc-name">'+E(first)+(un?' <span class="badge ok">'+un+' new</span>':'')+'</div><div class="pc-sub">'+E(sub||"No class yet")+'</div></div><span class="pc-open">Full sheet ›</span></button>'+
    '<div class="pc-hp"><div class="pc-hprow"><div class="pc-hpnum">'+c.hp+'<span> / '+c.hpMax+'</span>'+(c.hpTemp?'<small>+'+c.hpTemp+' temp</small>':'')+'</div>'+
    '<div class="pc-hpbtns"><button class="btn" data-act="hp" data-d="-5" aria-label="Lose 5 HP">−5</button><button class="btn" data-act="hp" data-d="-1" aria-label="Lose 1 HP">−1</button><button class="btn" data-act="hp" data-d="1" aria-label="Gain 1 HP">+1</button><button class="btn" data-act="hp" data-d="5" aria-label="Gain 5 HP">+5</button></div></div>'+
    '<div class="hpbar" role="img" aria-label="'+pct+' percent health"><i style="width:'+pct+'%;background:'+hpColor(c)+'"></i></div></div>'+
    '<div class="pc-stats"><div><b>'+c.ac+'</b><span>AC</span></div><div><b>'+sgn(mod(c.abilities.dex))+'</b><span>Init</span></div><div><b>'+passive(c)+'</b><span>Passive</span></div><div><b>'+(st?st.dc:"–")+'</b><span>DC</span></div><div><b>'+effSpeed(c).v+'</b><span>Speed</span></div></div>'+
    (flags?'<div class="pc-flags">'+flags+'</div>':'')+

function partyStatus(ids){
  const pcs=ids.filter(id=>!chars[id].npc);if(!pcs.length)return "";
  const tot=pcs.reduce((a,id)=>a+chars[id].hp,0),max=pcs.reduce((a,id)=>a+chars[id].hpMax,0);
  const low=pcs.slice().sort((a,b)=>chars[a].hp/Math.max(1,chars[a].hpMax)-chars[b].hp/Math.max(1,chars[b].hpMax))[0];
  const heal=[];
  pcs.forEach(id=>{
    const c=chars[id],bits=[];
    c.spells.forEach(s=>{if(HEALRE.test(s.name))bits.push(s.name)});
    c.actions.forEach(e=>{if(/lay on hands/i.test(e.name)){const ri=resIndex(c,e.res),r=ri>=0?c.resources[ri]:null;bits.push("Lay On Hands"+(r?" "+Math.max(0,r.max-r.used)+" left":""))}});
    if(bits.length)heal.push('<b>'+E((c.name||"").split(" ")[0])+'</b> '+E(bits.join(", ")));
  });
  const lc=chars[low];
  const cs=pcs.filter(id=>activeStd(chars[id]).length||customConds(chars[id]).length||chars[id].exhaustion).map(id=>'<b>'+E((chars[id].name||"").split(" ")[0])+'</b> '+E(activeStd(chars[id]).concat(customConds(chars[id])).concat(chars[id].exhaustion?["Exhaustion "+chars[id].exhaustion]:[]).join(", ")));
  const cc=pcs.filter(id=>chars[id].concentrating).map(id=>'<b>'+E((chars[id].name||"").split(" ")[0])+'</b> '+E(chars[id].concentrating));
  return '<div class="pstatus"><div><span class="k">Party HP</span> <b>'+tot+' / '+max+'</b></div><div><span class="k">Lowest</span> <b>'+E((lc.name||"").split(" ")[0])+' '+lc.hp+'/'+lc.hpMax+'</b></div>'+(cs.length?'<div class="wide"><span class="k">Conditions</span> '+cs.join(" · ")+'</div>':'')+(cc.length?'<div class="wide"><span class="k">Concentrating</span> '+cc.join(" · ")+'</div>':'')+(heal.length?'<div class="wide"><span class="k">Healing</span> '+heal.join(" · ")+'</div>':'')+'</div>';
}

function weaponRef(name){

  Object.keys(WALIAS).forEach(k=>{if(n.indexOf(k)>=0&&(!best||k.length>best.l))best={w:WALIAS[k],l:k.length}});
  Object.keys(WREF.weapons||{}).forEach(w=>{if(n.indexOf(w.toLowerCase())>=0&&(!best||w.length>best.l))best={w:w,l:w.length}});
  return best?Object.assign({name:best.w},WREF.weapons[best.w]):null;
}

function blankComp(){

function normComp(d){

function fromMonster(m){
  const c=blankComp();
  c.name=m.n;c.size=m.sz||"";c.type=m.t||"";c.cr=String(m.cr||"");c.ac=m.ac;c.hp=m.hp;c.hpMax=m.hp;c.speed=m.sp||"";

  c.saves=m.sv||"";c.skills=m.sk||"";c.senses=m.se||"";c.languages=m.ln||"";

  else if(tab==="gear")body=tabGear(openId);

  const keyOf=d=>d.dataset.n?"s:"+d.dataset.n:"t:"+((d.querySelector("summary")||{}).textContent||"").trim().slice(0,48);
  const openKeys=same?Array.from(host.querySelectorAll("details[open]")).map(keyOf):[];

function navItems(){

function renderNav(){

  if(on&&sc.scrollWidth>sc.clientWidth){
    const l=on.offsetLeft,r=l+on.offsetWidth;

function setThumb(sc,track){

/* a thin scroll bar under a row that scrolls sideways (works on phones, where normal scroll bars are hidden) */
function addTrack(row){
  if(!row||row.nextElementSibling&&row.nextElementSibling.classList.contains("sb-track"))return;
  const tr=document.createElement("div");tr.className="sb-track";tr.innerHTML="<i></i>";
  row.parentNode.insertBefore(tr,row.nextSibling);
  const upd=()=>setThumb(row,tr);
  row.addEventListener("scroll",upd,{passive:true});
  upd();requestAnimationFrame(upd);
}
function renderSubnav(){
  const el=$("subnav"),top=isDM()&&!(openId&&chars[openId]);
  let chips=null,active=null,group=null,seg=null;
  if(top&&dmTab==="session"){seg=segOf(subSession);chips=seg==="prep"?PREP_CHIPS:seg==="campaign"?CAMP_CHIPS:null;active=subSession;group="session"}
  else if(top&&dmTab==="monsters"){chips=MONS_CHIPS;active=subMons;group="monsters"}
  else if(top&&dmTab==="more"){chips=MORE_CHIPS;active=subMore;group="more"}
  if(!seg&&!chips){el.hidden=true;return}
  const prevRow=el.querySelector(".chips-row"),prev=prevRow?prevRow.scrollLeft:0;
  el.hidden=false;
  let h="";
  if(seg)h+='<div class="seg" role="group" aria-label="Session section">'+SESSION_SEGS.map(c=>'<button class="'+(seg===c[0]?"on":"")+'" data-act="seg" data-seg="'+c[0]+'" aria-pressed="'+(seg===c[0])+'">'+c[1]+'</button>').join("")+'</div>';
  if(chips)h+='<div class="chips-row">'+chips.map(c=>{let n=0;if(group==="more"&&c[0]==="msgs")Object.keys(chars).forEach(id=>{n+=unreadFrom(id,"player")});return '<button class="chip'+(active===c[0]?" on":"")+'" data-act="sub" data-g="'+group+'" data-p="'+c[0]+'">'+c[1]+(n?' ('+n+')':"")+'</button>'}).join("")+'</div>';
  el.innerHTML=h;
  const row=el.querySelector(".chips-row");
  if(row){row.scrollLeft=prev;const on=row.querySelector(".on");
    if(on&&row.scrollWidth>row.clientWidth){const l=on.offsetLeft,r=l+on.offsetWidth;if(l<row.scrollLeft||r>row.scrollLeft+row.clientWidth)row.scrollLeft=Math.max(0,l-20)}}
  if(row)addTrack(row);
}
function renderApp(){
  if(!role)return;
  const inSheet=!!(openId&&chars[openId]),dm=isDM(),top=dm&&!inSheet;
  const tomeTab=top&&(dmTab==="combat"||dmTab==="session"||dmTab==="monsters"||(dmTab==="more"&&(subMore==="cond"||subMore==="gen")));
  const show={party:top&&dmTab==="party",msgs:top&&dmTab==="more"&&subMore==="msgs",lookup:top&&dmTab==="more"&&subMore==="spells",tome:tomeTab,sheet:inSheet||(!dm)};
  $("viewParty").hidden=!show.party;$("viewMsgs").hidden=!show.msgs;$("viewLookup").hidden=!show.lookup;$("viewTome").hidden=!show.tome;$("viewSheet").hidden=!show.sheet;
  document.body.classList.toggle("compact",show.sheet||show.tome);
  if(!show.party)$("viewParty").innerHTML="";
  if(!show.msgs)$("viewMsgs").innerHTML="";
  if(!show.lookup)$("viewLookup").innerHTML="";
  if(!show.sheet)$("viewSheet").innerHTML="";
  const focused=sheetFocused();
  if(show.party&&(!focused||!$("viewParty").firstChild))renderParty();
  if(show.msgs){if(dmMsgChar&&$("thread"))updateThread();else if(!focused||!$("viewMsgs").firstChild)renderDMMsgs()}
  if(show.lookup&&!$("viewLookup").firstChild)renderLookup($("viewLookup"));
  if(show.tome)ensureTome();
  if(show.sheet){
    if(!focused||!$("viewSheet").firstChild)renderSheet();
    else{const t=$("thread");if(t&&sheetTab==="msgs")updateThread();const sb=$("sbarStat");if(sb&&chars[openId])sb.textContent=sbarStat(chars[openId])}
  }
  renderSubnav();
  renderNav();
  if(dm)tomeSheetsSoon();
}

/* ================= events ================= */
function setPath(obj,path,val){
  const p=path.split(".");let o=obj;
  for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}
  o[p[p.length-1]]=val;
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="hpAmt"){hpAmtVal=t.value;return}
  if(t.id==="lkQ"){lk.q=t.value;lk.limit=40;renderLookupResults();return}
  if(t.id==="cFilter"){fillTemplates();return}
  if(t.dataset&&t.dataset.dm==="notes"&&isDM()&&openId){dmNotes[openId]=t.value;autosize(t);queueNote(openId);return}
  const path=t.getAttribute&&t.getAttribute("data-path");
  if(!path)return;
  let val;
  if(t.type==="checkbox")val=t.checked;
  else if(t.type==="number")val=t.value===""?0:Number(t.value);
  else if(t.tagName==="SELECT"&&/\.level$/.test(path))val=Number(t.value);
  else val=t.value;
  if(t.dataset.comp){
    const parts=t.dataset.comp.split("|"),c=companions[parts[0]]&&companions[parts[0]][parts[1]];
    if(!c)return;setPath(c,path,val);if(t.tagName==="TEXTAREA")autosize(t);
    saveComp(parts[0],parts[1],[path.split(".")[0]]);return;
  }
  if(!openId||!canEditChar(openId))return;
  setPath(chars[openId],path,val);
  if(t.tagName==="TEXTAREA")autosize(t);
  const sb=$("sbarStat");if(sb)sb.textContent=sbarStat(chars[openId]);
  saveChar(openId,[path.split(".")[0]]);
});
document.addEventListener("change",e=>{

});

      const host=b.closest("[data-id]"),id=host?host.dataset.id:openId,x=chars[id];if(!x||!canEditChar(id))return;
      const n=b.dataset.n;let l=condList(x).filter(v=>canonCond(v)!=="Exhaustion");const has=l.some(v=>canonCond(v)===n);
      l=has?l.filter(v=>canonCond(v)!==n):l.concat(n);x.conditions=l.join(", ");
      if(!has&&INCAP.indexOf(n)>=0&&x.concentrating){const sp=x.concentrating;x.concentrating="";hostToast((x.name||"").split(" ")[0]+" is "+n+", so concentration on "+sp+" ends.")}

      x.concentrating="";saveChar(id,["concentrating"]);if(openId)renderSheet();else renderParty();return}

    case "cbtoggle":cbOpen=!cbOpen;renderCombatBar();return;
    case "cbinit":{

    case "abiltoggle":{showAbil=!showAbil;try{localStorage.setItem("showAbil",showAbil?"1":"0")}catch(e){}renderParty();return}

    case "namecodes":return allNameCodes();

    case "send":{const ta=$("msgIn");if(await sendMsg(b.dataset.char,ta.value)){ta.value=""}return}
    case "bcast":{const ta=$("bcastIn"),txt=ta.value.trim();if(!txt)return;for(const id of Object.keys(chars).filter(i=>!chars[i].npc))await sendMsg(id,txt);ta.value="";setStatus("Sent to everyone");return}
    case "lklv":lk.lv=b.dataset.v;lk.limit=40;renderLookup(b.closest("#viewLookup")||$("lkHost"));return;
    case "lkconc":lk.conc=!lk.conc;lk.limit=40;renderLookup(b.closest("#viewLookup")||$("lkHost"));return;

    case "savecs":return saveCustomSpell();

    case "addspell":{const ch=chars[charId];if(!ch)return;ch.spells.push({name:b.dataset.n,level:Number(b.dataset.l),desc:""});saveChar(charId,["spells"]);b.outerHTML='<span class="sub">Added to your spells.</span>';return}

    case "cvis":{const x=companions[b.dataset.ch][b.dataset.pid];x.visible=!x.visible;saveComp(b.dataset.ch,b.dataset.pid,["visible"]);renderSheet();return}
    case "cedit":{const k=b.dataset.ch+"|"+b.dataset.pid;compEdit[k]=!compEdit[k];renderSheet();return}
    case "cdel":{if(confirm("Delete this creature?"))deleteDoc(doc(db,"characters",b.dataset.ch,"companions",b.dataset.pid)).catch(()=>setStatus("Could not delete",true));return}
    case "chp":{const x=companions[b.dataset.ch]&&companions[b.dataset.ch][b.dataset.pid];if(!x)return;x.hp=Math.max(0,Math.min(x.hpMax,x.hp+Number(b.dataset.d)));saveComp(b.dataset.ch,b.dataset.pid,["hp"]);renderSheet();return}
    case "caddentry":{const x=companions[b.dataset.ch][b.dataset.pid];x[b.dataset.list].push({name:"",desc:""});saveComp(b.dataset.ch,b.dataset.pid,[b.dataset.list]);renderSheet();return}
    case "cdelentry":{const x=companions[b.dataset.ch][b.dataset.pid];x[b.dataset.list].splice(Number(b.dataset.i),1);saveComp(b.dataset.ch,b.dataset.pid,[b.dataset.list]);renderSheet();return}
  }
  if(!c||!canEditChar(openId)){if(act==="delsheet"&&isDM()&&c)return delSheet();return}
  const id=openId;
  switch(act){
    case "dmg":case "heal":{

      if(act==="dmg"){const taken=applyHpDelta(c,-amt);concAfter(id,taken)}
      else applyHpDelta(c,amt);

function applyRest(id,kind){
  const c=chars[id],info=classInfo(c.cls),pact=info&&info.caster==="pact";
  const keys=["resources"];
  c.resources.forEach(r=>{
    if(kind==="long"){if(r.reset==="hitdice")r.used=Math.max(0,r.used-Math.ceil(r.max/2));else if(r.reset!=="manual")r.used=0}
    else if(r.reset==="short"||r.reset==="combat")r.used=0;
    else if(r.reset==="short1")r.used=Math.max(0,r.used-1);
  });
  c.concentrating="";keys.push("concentrating");
  if(kind==="long"){c.hp=c.hpMax;c.hpTemp=0;c.deathS=0;c.deathF=0;c.exhaustion=Math.max(0,(c.exhaustion||0)-1);Object.keys(c.slots).forEach(k=>{c.slots[k].used=0});keys.push("hp","hpTemp","deathS","deathF","slots","exhaustion")}
  else if(pact){Object.keys(c.slots).forEach(k=>{c.slots[k].used=0});keys.push("slots")}
  saveChar(id,keys);
}
function doRest(kind){
  const c=chars[openId],pact=classInfo(c.cls)&&classInfo(c.cls).caster==="pact";
  const msg=kind==="long"?"Take a long rest? This restores your HP, spell slots and all limited-use features.":"Take a short rest? This restores short-rest features"+(pact?" and your pact slots":"")+".";
  if(!confirm(msg))return;
  applyRest(openId,kind);renderSheet();setStatus(kind==="long"?"Long rest taken":"Short rest taken");
}
function restAll(kind){
  const ids=Object.keys(chars).filter(id=>!chars[id].npc);
  if(!ids.length)return;
  if(!confirm(kind==="long"?"Long rest for the whole party? This restores everyone’s HP, spell slots and limited-use features.":"Short rest for the whole party? This restores short-rest features and pact slots."))return;
  ids.forEach(id=>applyRest(id,kind));
  renderApp();setStatus(kind==="long"?"Party long rest taken":"Party short rest taken");
}
function confirmLevelUp(c){
  const gain=Math.max(0,Math.floor(Number($("lvGain").value)||0));
  const updSlots=$("lvSlots")?$("lvSlots").checked:false;
  const info=classInfo(c.cls),die=info?info.die:8,nl=c.level+1,old=c.level;
  c.level=nl;c.hpMax+=gain;c.hp+=gain;
  const m=/^(\d+)d(\d+)$/.exec(String(c.hitDice||"").trim());
  c.hitDice=nl+"d"+(m?m[2]:die);
  c.resources.forEach(r=>{if(r.reset==="hitdice"){r.max=nl}});
  if(updSlots)c.slots=slotsFor(info,nl,c.slots);
  c.history=[{t:Date.now(),text:"Level "+old+" → "+nl+": +"+gain+" max HP"}].concat(c.history).slice(0,30);
  lvlUp=null;
  saveChar(openId,["level","hpMax","hp","hitDice","slots","history","resources"]);
  renderSheet();window.scrollTo(0,0);
}

/* ================= DM tools ================= */
const slugId=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("s"+Date.now());
async function addNpc(){
  const id="npc"+Math.random().toString(36).slice(2,8),c=blank();c.name="New NPC";c.npc=true;c.updated=Date.now();
  try{await setDoc(doc(db,"characters",id),c);chars[id]=c;openId=id;sheetTab="play";editMode=true;renderApp();window.scrollTo(0,0)}
  catch(err){setStatus("Could not add NPC ("+(err&&err.code||"error")+")",true)}
}
async function delSheet(){
  const c=chars[openId];if(!c)return;
  if(!confirm("Delete “"+(c.name||"this sheet")+"” for good? This also removes its DM notes, creatures, messages and login name."))return;
  const id=openId;openId=null;lvlUp=null;renderApp();
  try{
    for(const pid of Object.keys(companions[id]||{}))await deleteDoc(doc(db,"characters",id,"companions",pid));
    for(const m of (messages[id]||[]))await deleteDoc(doc(db,"characters",id,"messages",m.id));
    await deleteDoc(doc(db,"characters",id));
    await deleteDoc(doc(db,"dmnotes",id));
    if(claimByChar[id])await deleteDoc(doc(db,"claims",claimByChar[id]));
  }catch(err){setStatus("Could not delete ("+(err&&err.code||"error")+")",true)}
}
async function setCodeTo(id,code){
  code=slugName(code);
  if(code.length<2){setStatus("A login name needs at least 2 letters or numbers",true);return false}
  const taken=Object.keys(claimByChar).filter(k=>claimByChar[k]===code&&k!==id)[0];
  if(taken){setStatus("“"+code+"” is already used by another character",true);return false}
  const old=claimByChar[id];if(old===code)return true;
  try{
    await setDoc(doc(db,"claims",code),{charId:id});
    claimByChar[id]=code;
    if(old)await deleteDoc(doc(db,"claims",old));
    setStatus("Login name set to “"+code+"”");return true;
  }catch(err){setStatus("Could not set login name ("+(err&&err.code||"error")+")",true);return false}
}
function changeCode(id){
  const cur=claimByChar[id]||slugName(chars[id].player||chars[id].name);
  const v=window.prompt("Login name for "+(chars[id].player||chars[id].name)+" (letters and numbers only). Anyone who knows it can open this sheet, so use something harder to guess if you like.",cur);
  if(v)setCodeTo(id,v).then(()=>renderApp());
}
async function allNameCodes(){
  const ids=Object.keys(chars).filter(id=>!chars[id].npc);
  for(const id of ids){await setCodeTo(id,slugName(chars[id].player||chars[id].name))}
  renderApp();
}
async function saveCustomSpell(){

async function pack(str){
  if(typeof CompressionStream==="undefined")return {enc:"raw",data:str};
  const cs=new CompressionStream("gzip"),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();
  const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin="";
  for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
  return {enc:"gzip",data:btoa(bin)};
}
async function unpack(enc,data){
  if(enc!=="gzip"||!data)return data||"";
  const bin=atob(data),buf=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream("gzip"),w=ds.writable.getWriter();
  w.write(buf);w.close();return await new Response(ds.readable).text();
}

}
function sendParty(){
  if(tomeState!=="ready"||typeof window.__tomeParty!=="function")return;
  const sheets=Object.keys(chars).filter(id=>!chars[id].npc).map(toLegacy);
  const json=JSON.stringify(sheets);
  if(json===tomeSent){window.__tomeSheetsChanged&&window.__tomeSheetsChanged();return}
  tomeSent=json;window.__tomeParty(sheets);
}
function tomeSheetsSoon(){
  if(tomeState!=="ready")return;
  clearTimeout(tomeTimer);tomeTimer=setTimeout(sendParty,250);
}
/* Live link between the tome's tools and the sheets */
const shortOf=n=>String(n||"").split(" ")[0];
const bid=short=>Object.keys(chars).filter(id=>!chars[id].npc&&shortOf(chars[id].name)===short)[0];
function slotKey(key){const m=/^slot(\d)$/.exec(key);return m?m[1]:null}
window.PartyBridge={
  pc(short){const id=bid(short);if(!id)return null;const c=chars[id];return {hp:c.hp,hpMax:c.hpMax,ac:c.ac,deathS:c.deathS,deathF:c.deathF,conds:activeStd(c),initRoll:c.initRoll}},
  idOf(short){return bid(short)||null},
  setConds(short,arr){const id=bid(short);if(!id)return;const c=chars[id];const std=arr.map(canonCond).filter(n=>n&&n!=="Exhaustion");c.conditions=std.concat(customConds(c)).join(", ");saveChar(id,["conditions"]);tomeSheetsSoon();if(!openId&&dmTab==="party")renderApp()},
  addExh(short){const id=bid(short);if(!id)return;const c=chars[id];c.exhaustion=Math.min(6,(c.exhaustion||0)+1);saveChar(id,["exhaustion"]);hostToast(shortOf(c.name)+" now has Exhaustion level "+c.exhaustion+".");tomeSheetsSoon();if(!openId&&dmTab==="party")renderApp()},
  setHP(short,hp){const id=bid(short);if(!id)return;const c=chars[id];hp=Math.max(0,Math.min(c.hpMax,Math.round(Number(hp)||0)));if(c.hp===hp)return;
    const taken=applyHpDelta(c,hp-c.hp);concAfter(id,taken);saveChar(id,["hp","hpTemp","deathS","deathF","concentrating"]);tomeSheetsSoon();if(!openId&&dmTab==="party")renderApp()},
  setDeath(short,s,f){const id=bid(short);if(!id)return;const c=chars[id];c.deathS=Math.max(0,Math.min(3,s));c.deathF=Math.max(0,Math.min(3,f));saveChar(id,["deathS","deathF"])},
  trackers(short){
    const id=bid(short);if(!id)return [];const c=chars[id],pact=classInfo(c.cls)&&classInfo(c.cls).caster==="pact",t=[];
    Object.keys(c.slots).map(Number).sort((a,b)=>a-b).forEach(l=>{const s=c.slots[l];if(s.max>0)t.push({key:"slot"+l,label:pact?"Pact slots (level "+l+")":"Level "+l+" slots",max:s.max,reset:pact?"short":"long",kind:"pips"})});
    c.resources.forEach((r,i)=>{if(r.reset==="hitdice"||r.max<=0)return;t.push({key:"r"+i,label:shortRes(r.name),max:r.max,reset:r.reset==="combat"?"combat":r.reset==="short"?"short":"long",kind:r.max>8?"pool":"pips"})});
    return t;
  },
  used(short,key){const id=bid(short);if(!id)return 0;const c=chars[id],sl=slotKey(key);
    if(sl)return (c.slots[sl]&&c.slots[sl].used)||0;
    const m=/^r(\d+)$/.exec(key);return m&&c.resources[Number(m[1])]?c.resources[Number(m[1])].used||0:0},
  setUsed(short,key,val){const id=bid(short);if(!id)return;const c=chars[id],sl=slotKey(key);val=Math.max(0,Math.round(Number(val)||0));
    if(sl&&c.slots[sl]){c.slots[sl].used=Math.min(val,c.slots[sl].max);saveChar(id,["slots"])}
    else{const m=/^r(\d+)$/.exec(key);if(m&&c.resources[Number(m[1])]){const r=c.resources[Number(m[1])];r.used=Math.min(val,r.max);saveChar(id,["resources"])}}
    tomeSheetsSoon();if(!openId&&dmTab==="party")renderApp()},
  rest(short,kind){const id=bid(short);if(!id)return;applyRest(id,kind);tomeSheetsSoon();if(!openId&&dmTab==="party")renderApp()}
};
const fetchText=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u+" HTTP "+r.status);return r.text()});
async function ensureTome(){
  if(tomeState==="ready"){tomeShow();return}
  if(tomeState==="loading")return;
  tomeState="loading";
  const host=$("tome");
  host.innerHTML='<div class="empty">Loading your campaign tools…</div>';
  try{
    await pullCampaign();
    const [css,html,js]=await Promise.all([fetchText("tome.css"),fetchText("tome.html"),fetchText("tome.js"),loadSpells(),loadMonsters()]);
    if(!document.getElementById("tome-css")){const st=document.createElement("style");st.id="tome-css";st.textContent=css;document.head.appendChild(st)}
    host.innerHTML=html;
    if(!document.getElementById("print-sheet")){const p=document.createElement("div");p.id="print-sheet";p.setAttribute("aria-hidden","true");document.body.appendChild(p)}
    const sc=document.createElement("script");sc.textContent=js;document.body.appendChild(sc);
    if(typeof window.__tomeSetData!=="function")throw new Error("tome.js did not start");
    window.__tomeSetData(spellDB,monsterList);
    window.__tomeOnPane=name=>{
      let g=dmTab,ss=subSession,sm=subMons,sx=subMore;
      if(name==="init")g="combat";
      else if(name==="mdb"){g="monsters";sm="lib"}
      else if(name==="s7"){if(dmTab==="monsters")sm="prep";else{g="session";ss="s7";segLast.prep="s7"}}
      else if(name==="cond"||name==="gen"){g="more";sx=name}
      else{g="session";ss=name;segLast[segOf(name)]=name}
      if(g!==dmTab||ss!==subSession||sm!==subMons||sx!==subMore){dmTab=g;subSession=ss;subMons=sm;subMore=sx;openId=null;renderApp();window.scrollTo(0,0)}
    };
    window.__tomeGoLibrary=()=>{dmTab="monsters";subMons="lib";openId=null;renderApp();window.scrollTo(0,0)};
    window.__tomeGoPrepared=()=>{dmTab="monsters";subMons="prep";openId=null;renderApp();window.scrollTo(0,0)};
    document.dispatchEvent(new Event("DOMContentLoaded",{bubbles:true}));
    tomeState="ready";tomeSent="";shareLabel();restoreFight();
    sendParty();
    setInterval(syncCampaignTick,5000);
    window.addEventListener("pagehide",()=>{syncCampaignTick()});
    tomeShow();
  }catch(e){
    tomeState="error";
    host.innerHTML='<div class="empty">Could not load the campaign tools ('+E(e&&e.message||"error")+'). Make sure tome.css, tome.html, tome.js, spells-2024.json and monsters-2024.json are in the same folder as index.html.<br><br><button class="btn" data-act="tomeretry">Try again</button></div>';
  }
}
function tomeShow(){
  const root=$("tome");if(!root||tomeState!=="ready")return;
  root.dataset.view=dmTab;
  const pane=dmTab==="combat"?"init":dmTab==="session"?subSession:dmTab==="monsters"?(subMons==="lib"?"mdb":"s7"):subMore;
  const el=document.getElementById("tab-"+pane);
  if(el&&!el.classList.contains("active")){
    /* press the tool's own (hidden) tab button so its "refresh when opened" hooks run: Run Session, Web, Monsters */
    const b=root.querySelector('[data-ac="tab-'+pane+'"]');
    if(b)b.click();else if(window.__tome&&window.__tome.sw)window.__tome.sw(pane);
  }
}

/* ================= live data ================= */
function subscribeChar(id){
  if(charSubs[id]||chars[id]&&chars[id].npc)return;
  charSubs[id]=[
    onSnapshot(collection(db,"characters",id,"companions"),snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=keepLocal("p:"+id+"/",d.id,normComp(d.data()||{}),companions[id]&&companions[id][d.id])});
      companions[id]=m;renderApp();
    },()=>{}),
    onSnapshot(query(collection(db,"characters",id,"messages"),orderBy("t")),snap=>{
      messages[id]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderApp();
    },()=>{})
  ];
}
function startApp(){
  $("gate").hidden=true;$("app").hidden=false;
  unsubs.forEach(u=>u());unsubs=[];Object.keys(charSubs).forEach(k=>charSubs[k].forEach(u=>u()));charSubs={};
  chars={};dmNotes={};claimByChar={};companions={};messages={};customSpells=[];lvlUp=null;editMode=false;combat=null;cbFirst=true;cbOpen=false;lastCbKey="";cbWasLive=false;{const b=document.getElementById("combatBar");if(b){b.innerHTML="";b.hidden=true}}
  $("who").innerHTML=isDM()?'<span class="badge dm">Dungeon Master</span>':'<span class="badge">Player</span>';
  $("outBtn").hidden=false;
  unsubs.push(onSnapshot(collection(db,"customSpells"),snap=>{customSpells=snap.docs.map(d=>d.data());if($("lkQ"))renderLookupResults()},()=>{}));
  if(isDM()){
    openId=null;dmTab="party";subSession="run";subMons="prep";subMore="msgs";sheetTab="play";
    unsubs.push(onSnapshot(collection(db,"characters"),snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=keepLocal("c:",d.id,normalize(d.data()||{}),chars[d.id])});
      chars=next;if(openId&&!chars[openId])openId=null;
      Object.keys(chars).forEach(subscribeChar);
      renderApp();setStatus("Live");
    },e=>setStatus("Sync problem ("+(e&&e.code||"error")+")",true)));
    unsubs.push(onSnapshot(collection(db,"claims"),snap=>{claimByChar={};snap.docs.forEach(d=>{const cid=(d.data()||{}).charId;if(cid)claimByChar[cid]=d.id});renderApp()},()=>{}));
    unsubs.push(onSnapshot(collection(db,"dmnotes"),snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=(d.data()||{}).text||""});
      const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.dm))dmNotes=next;
    },()=>{}));
  }else{
    openId=charId;sheetTab="play";
    unsubs.push(onSnapshot(doc(db,"characters",charId),snap=>{
      if(!snap.exists()){chars={};$("notice").innerHTML='<div class="note">Your sheet isn’t set up yet. Ask your DM.</div>';renderApp();return}
      $("notice").innerHTML="";
      const prevC=chars[charId];
      chars[charId]=keepLocal("c:",charId,normalize(snap.data()||{}),chars[charId]);
      remoteNotes(prevC,chars[charId]);
      renderApp();setStatus("Live");
    },e=>{
      if(e&&e.code==="permission-denied")showGate("Your login no longer works. Type your name again, or ask your DM.");
      else setStatus("Sync problem ("+(e&&e.code||"error")+")",true);
    }));
    unsubs.push(onSnapshot(doc(db,"combat","live"),snap=>{
      combat=snap.exists()?snap.data():null;
      const first=cbFirst;cbFirst=false;
      if(first&&combat&&combat.order&&combat.turn>=0&&combat.order[combat.turn])lastCbKey=combat.round+":"+combat.turn+":"+combat.order[combat.turn].n;
      renderCombatBar();if(!first)cbNotify();
    },()=>{}));
    unsubs.push(onSnapshot(query(collection(db,"characters",charId,"companions"),where("visible","==",true)),snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=keepLocal("p:"+charId+"/",d.id,normComp(d.data()||{}),companions[charId]&&companions[charId][d.id])});
      companions[charId]=m;renderApp();
    },()=>{}));
    unsubs.push(onSnapshot(query(collection(db,"characters",charId,"messages"),orderBy("t")),snap=>{
      messages[charId]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderApp();
    },()=>{}));
  }
  renderApp();
}

/* ================= auth flow ================= */
function showGate(msg){
  unsubs.forEach(u=>u());unsubs=[];Object.keys(charSubs).forEach(k=>charSubs[k].forEach(u=>u()));charSubs={};
  chars={};openId=null;role=null;lvlUp=null;
  $("app").hidden=true;$("gate").hidden=false;$("bnav").hidden=true;document.body.classList.add("nonav");document.body.classList.remove("compact");
  $("who").textContent="Not signed in";$("outBtn").hidden=!uid;
  const m=$("gateMsg");m.className="msg"+(msg?" err":"");m.textContent=msg||"";
}
async function enter(user){
  const tok=++enterTok;
  if(!user){uid=null;showGate();return}
  uid=user.uid;isAnon=user.isAnonymous;role=null;charId=null;
  try{await getDoc(doc(db,"config","dm"));role="dm"}catch(e){}
  if(!role){
    try{const m=await getDoc(doc(db,"members",uid));if(m.exists()&&m.data().charId){role="player";charId=m.data().charId}}catch(e){}
  }
  if(tok!==enterTok)return;
  if(!role){showGate(isAnon?"":"That Google account isn’t the DM account. Players: type your name.");return}
  startApp();
}
onAuthStateChanged(auth,user=>{enter(user)});
$("joinBtn").addEventListener("click",async()=>{
  const code=slugName($("codeIn").value),msg=$("gateMsg");
  if(code.length<2){msg.className="msg err";msg.textContent="Type your first name.";return}
  msg.className="msg";msg.textContent="Opening…";
  try{
    if(!auth.currentUser)await signInAnonymously(auth);
    const claim=await getDoc(doc(db,"claims",code));
    if(!claim.exists()){msg.className="msg err";msg.textContent="That name isn’t right. Check it with your DM.";return}
    const cid=claim.data().charId;
    await setDoc(doc(db,"members",auth.currentUser.uid),{code:code,charId:cid,joinedAt:serverTimestamp()});
    msg.textContent="";
    await enter(auth.currentUser);
  }catch(e){
    msg.className="msg err";
    msg.textContent=(e&&e.code==="permission-denied")?"That name isn’t right. Check it with your DM.":"Could not open ("+(e&&e.code||"error")+").";
  }
});
$("googleBtn").addEventListener("click",async()=>{
  const msg=$("gateMsg2");msg.className="msg";msg.textContent="";
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){msg.className="msg err";msg.textContent="Google sign-in failed ("+(e&&e.code||"error")+")."}
});
async function doSignOut(){
  if(isAnon&&!confirm("Sign out? You can get back in any time by typing your name."))return;
  await signOut(auth);
}
