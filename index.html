<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Sheets">
<title>Party Sheets</title>
<style>
:root{
  --bg:#eef1ee; --panel:#fbfcfb; --ink:#1d2a27; --muted:#5d6e69; --line:#cdd7d3;
  --accent:#1f6f66; --accent-ink:#ffffff; --brass:#9a6b1a;
  --hp-ok:#2e8b57; --hp-mid:#c98a14; --hp-low:#b83a32; --chip:#e3ebe8; --field:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121917; --panel:#1a2421; --ink:#e4ece9; --muted:#97aaa4; --line:#2d3b37;
    --accent:#4fb3a6; --accent-ink:#0b1412; --brass:#d9a441;
    --hp-ok:#4cc27f; --hp-mid:#e0a63a; --hp-low:#e0675e; --chip:#25322e; --field:#141c19;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
body.nonav{padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:0;font-weight:700;letter-spacing:.01em}
button,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 0 14px;border-bottom:2px solid var(--brass);margin-bottom:16px}
header.top h1{font-size:1.8rem}
.sub{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--chip);font-size:.78rem;font-weight:600}
.badge.dm{background:var(--brass);color:#fff}
.badge.ok{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.88rem;min-height:36px}
.btn.danger{color:var(--hp-low)}
.btn.dmg{color:var(--hp-low);border-color:var(--hp-low)}
.btn.heal{color:var(--hp-ok);border-color:var(--hp-ok)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:.85rem;color:var(--muted)}
.status.err,.sub.err{color:var(--hp-low)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.15rem;line-height:1.2}
.card .who{color:var(--muted);font-size:.85rem}
.hpbar{height:12px;border-radius:6px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.hpbar>i{display:block;height:100%}
.hprow{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.hpnum{font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat,.tile{background:var(--chip);border-radius:10px;padding:6px 4px;text-align:center}
.stat b,.tile b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat span,.tile span{font-size:.72rem;color:var(--muted)}
.tile b{font-size:1.4rem;font-family:Georgia,serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:14px}
.tile .ctl{display:flex;gap:4px;justify-content:center;margin-top:2px}
.conds{font-size:.85rem;color:var(--hp-low)}
.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
.row{display:grid;gap:10px}
.cols4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=search],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:72px;resize:vertical}
.sheet{margin-top:0}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border:1px solid var(--line);border-bottom:2px solid var(--brass);border-radius:12px;margin-bottom:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sbar-title{display:flex;flex-direction:column;min-width:0;flex:1 1 140px}
.sbar-title strong{font-family:Georgia,serif;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpctl{display:flex;gap:6px;align-items:center;flex:1 1 100%}
.hpctl input{width:84px;text-align:center}
.hpctl .btn{flex:1}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.pane>h3{font-size:1.05rem;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.ident{margin-bottom:12px;font-size:1.05rem}
.hp-big{font-family:Georgia,serif;font-size:2.2rem;font-weight:700;line-height:1.1}
.hp-big small{font-size:1.1rem;color:var(--muted)}
.hp-big .tmp{font-size:.95rem;color:var(--accent);font-family:inherit}
.abil{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.ab{background:var(--chip);border-radius:10px;padding:8px 4px;text-align:center}
.ab .nm{font-size:.75rem;color:var(--muted);font-weight:700}
.ab .md{font-size:1.5rem;font-weight:700;font-family:Georgia,serif}
.ab .sc{font-size:.8rem;color:var(--muted)}
.ab input{width:64px;text-align:center;margin:0 auto;padding:4px}
.prof{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.95rem;border-bottom:1px dashed var(--line);min-height:36px}
.prof .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.dot{width:14px;text-align:center;color:var(--brass);font-weight:700}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:transparent;padding:0}
.pip.used{background:var(--accent)}
.pips{display:flex;gap:8px;flex-wrap:wrap}
.slotrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.slotrow .lv{min-width:64px;font-weight:700}
.res{padding:8px 0;border-bottom:1px dashed var(--line)}
.res-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.res-h b{font-weight:700}
.counter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.counter b{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.atk-card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.atk-card .hit{font-weight:700;font-size:1.15rem;font-family:Georgia,serif;text-align:right}
.atk-card .dm2{grid-column:1/-1}
.atkedit{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:6px;margin-bottom:10px}
.atkedit>:nth-child(5){grid-column:1/-1}
details.entry,details.spell{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--field)}
details.entry>summary,details.spell>summary{list-style:none;cursor:pointer;padding:10px 12px;min-height:44px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
details.entry>summary::-webkit-details-marker,details.spell>summary::-webkit-details-marker{display:none}
details.entry>summary::before,details.spell>summary::before{content:"▸";color:var(--brass);transition:transform .15s}
details[open].entry>summary::before,details[open].spell>summary::before{transform:rotate(90deg)}
details.entry>.body,details.spell>.spell-body{padding:0 12px 12px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.entry-edit{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px;background:var(--field)}
.entry-edit .h{display:flex;gap:6px;margin-bottom:6px}
.entry-edit input{font-weight:700}
.lvl{background:var(--chip);border:2px solid var(--brass);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.lvl h3{font-size:1.1rem}
.hist{font-size:.9rem;padding:4px 0;border-bottom:1px solid var(--line)}
.note{background:var(--chip);padding:10px 14px;border-radius:8px;font-size:.9rem;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.codes{margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.codes>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.coderow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.coderow .nm{flex:1 1 140px;min-width:0}
.coderow code{font-size:1rem;background:var(--chip);padding:4px 8px;border-radius:6px;user-select:all}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:10px}
.gatecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.gatecard h2{font-size:1.25rem}
.msg{font-size:.9rem;min-height:1.2em}
.msg.err{color:var(--hp-low)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:2px solid var(--brass);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0);scrollbar-width:none}
.bnav::-webkit-scrollbar{display:none}
.bnav button{flex:1 0 66px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:0;border-top:3px solid transparent;font-size:.72rem;color:var(--muted);position:relative}
.bnav button.on{color:var(--accent);font-weight:700;border-top-color:var(--accent)}
.bnav .ico{font-size:1.25rem;line-height:1}
.bnav .n{position:absolute;top:4px;left:calc(50% + 6px);background:var(--hp-low);color:#fff;border-radius:99px;font-size:.66rem;min-width:18px;padding:0 5px;line-height:18px}
.lk-bar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:.88rem;min-height:36px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lk-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.sd-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px;margin-bottom:8px}
.sd-meta span{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.spell>summary .sub{font-weight:400}
.thread{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto;padding:4px 2px;margin-bottom:10px}
.bub{max-width:86%;padding:8px 12px;border-radius:14px;background:var(--chip);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub .t{font-size:.72rem;opacity:.75;margin-top:2px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px}
.comp{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--brass);border-radius:12px;padding:12px;margin-bottom:12px}
.comp-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;margin:8px 0}
.mini div{background:var(--chip);border-radius:8px;padding:4px 0;font-size:.8rem}
.mini b{display:block}
.camp-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
#campFrame{width:100%;height:calc(100vh - 190px);min-height:480px;border:1px solid var(--line);border-radius:10px;background:#fff}
.legal{font-size:.75rem;color:var(--muted);margin-top:14px}
@media (max-width:700px){
  .wrap{padding:10px}
  header.top{padding:4px 0 10px;margin-bottom:10px;gap:8px}
  header.top h1{font-size:1.45rem}
  body.compact header.top{display:none}
  .btn{min-height:44px}
  .btn.small{min-height:40px;min-width:40px}
  input[type=text],input[type=number],input[type=search],textarea,select{font-size:16px;padding:10px}
  .grid{grid-template-columns:1fr}
  .stats{gap:4px}
  .cols4{grid-template-columns:repeat(2,1fr)}
  .pip{width:32px;height:32px}
  .prof{min-height:44px}
  .atkedit{grid-template-columns:1fr 2fr auto}
  .atkedit>:nth-child(1){grid-column:1/3;grid-row:1}
  .atkedit>:nth-child(4){grid-column:3;grid-row:1}
  .atkedit>:nth-child(2){grid-column:1;grid-row:2}
  .atkedit>:nth-child(3){grid-column:2/4;grid-row:2}
  .atkedit>:nth-child(5){grid-column:1/-1;grid-row:3}
  #campFrame{height:calc(100vh - 150px)}
  .split{grid-template-columns:1fr}
}
@media (min-width:701px) and (max-width:1100px){
  .wrap{padding:14px 18px}
  .btn.small{min-height:40px}
  .pip{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){details.entry>summary::before,details.spell>summary::before{transition:none}}
</style>
</head>
<body class="nonav">
<div class="wrap">
  <header class="top">
    <div>
      <h1>Party Sheets</h1>
      <div class="sub" id="who">Loading…</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status"></span>
      <button class="btn" data-act="signout" id="outBtn" hidden>Sign out</button>
    </div>
  </header>

  <section id="gate" class="gate" hidden>
    <div class="gatecard">
      <h2>Players: open your character</h2>
      <p class="sub" style="margin:0">Type your first name (the one your DM gave you). No account or email needed.</p>
      <label class="f">Your name<input type="text" id="codeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. jason"></label>
      <button class="btn primary" id="joinBtn">Open my character</button>
      <div class="msg" id="gateMsg" role="status"></div>
    </div>
    <div class="gatecard">
      <h2>Dungeon Master</h2>
      <p class="sub" style="margin:0">Sign in with your Google account to see every sheet.</p>
      <button class="btn" id="googleBtn">Sign in with Google</button>
      <div class="msg" id="gateMsg2" role="status"></div>
    </div>
  </section>

  <main id="app" hidden>
    <div id="notice"></div>
    <section id="viewParty" hidden></section>
    <section id="viewMsgs" hidden></section>
    <section id="viewLookup" hidden></section>
    <section id="viewCampaign" hidden></section>
    <section id="viewSheet" hidden aria-live="polite"></section>
  </main>
</div>
<nav class="bnav" id="bnav" aria-label="Sections" hidden></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDYnsx30sdSSQm9Khjdc8gJ_BJLjHMhL4g",
  authDomain: "dnd-campaign-companion-app.firebaseapp.com",
  projectId: "dnd-campaign-companion-app",
  storageBucket: "dnd-campaign-companion-app.firebasestorage.app",
  messagingSenderId: "305544250683",
  appId: "1:305544250683:web:6b38e7bbe9bc3e23a1231e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/*IMPORT_START*/
const ABIL=["str","dex","con","int","wis","cha"];
const ABN={str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};
const SKILLS=[["Acrobatics","dex"],["Animal Handling","wis"],["Arcana","int"],["Athletics","str"],["Deception","cha"],["History","int"],["Insight","wis"],["Intimidation","cha"],["Investigation","int"],["Medicine","wis"],["Nature","int"],["Perception","wis"],["Performance","cha"],["Persuasion","cha"],["Religion","int"],["Sleight of Hand","dex"],["Stealth","dex"],["Survival","wis"]];
const mod=n=>Math.floor((Number(n==null?10:n)-10)/2);
const sgn=n=>(n>=0?"+":"")+n;
const prof=l=>2+Math.floor((Math.max(1,Number(l)||1)-1)/4);
const CLASSES={
  barbarian:{die:12},bard:{die:8,caster:"full",ab:"cha"},cleric:{die:8,caster:"full",ab:"wis"},
  druid:{die:8,caster:"full",ab:"wis"},fighter:{die:10},monk:{die:8},
  paladin:{die:10,caster:"half",ab:"cha"},ranger:{die:10,caster:"half",ab:"wis"},rogue:{die:8},
  sorcerer:{die:6,caster:"full",ab:"cha"},warlock:{die:8,caster:"pact",ab:"cha"},
  wizard:{die:6,caster:"full",ab:"int"},artificer:{die:8,caster:"artificer",ab:"int"}
};
const FULL=[[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
const HALF=[[],[2],[3],[3],[4,2],[4,2],[4,3],[4,3],[4,3,2],[4,3,2],[4,3,3],[4,3,3],[4,3,3,1],[4,3,3,1],[4,3,3,2],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2]];
const PACT=[[1,1],[2,1],[2,2],[2,2],[2,3],[2,3],[2,4],[2,4],[2,5],[2,5],[3,5],[3,5],[3,5],[3,5],[3,5],[3,5],[4,5],[4,5],[4,5],[4,5]];
function classInfo(name){
  const n=String(name||"").toLowerCase();
  for(const k in CLASSES)if(n.indexOf(k)>=0)return CLASSES[k];
  return null;
}
function slotsFor(info,level,old){
  const out={};
  if(!info||!info.caster)return out;
  const L=Math.max(1,Math.min(20,Number(level)||1));
  let arr=[];
  if(info.caster==="full")arr=FULL[L-1];
  else if(info.caster==="half")arr=HALF[L-1];
  else if(info.caster==="artificer")arr=FULL[Math.ceil(L/2)-1];
  else if(info.caster==="pact"){const p=PACT[L-1];out[p[1]]={max:p[0],used:0}}
  arr.forEach((n,i)=>{out[i+1]={max:n,used:0}});
  if(old)Object.keys(out).forEach(k=>{const u=(old[k]&&old[k].used)||0;out[k].used=Math.min(u,out[k].max)});
  return out;
}
function blank(){
  const a={};ABIL.forEach(k=>a[k]=10);
  return {name:"New adventurer",player:"",race:"",cls:"",subclass:"",alignment:"",size:"",level:1,background:"",
    abilities:a,saveProf:{},skillProf:{},skillExtra:{},ac:10,speed:30,hpMax:10,hp:10,hpTemp:0,hitDice:"",
    deathS:0,deathF:0,inspiration:0,conditions:"",spellAbility:"",slots:{},spells:[],spellInfo:[],
    attacks:[],actions:[],features:[],traits:[],resources:[],inventory:"",gold:0,languages:"",goals:"",backstory:"",notes:"",
    history:[],npc:false,updated:0};
}
function normalize(d){
  const b=blank(),o=Object.assign({},b,d);
  o.abilities=Object.assign({},b.abilities,d.abilities||{});
  ["saveProf","skillProf","skillExtra","slots"].forEach(k=>{o[k]=(d[k]&&typeof d[k]==="object")?d[k]:{}});
  ["spells","spellInfo","attacks","actions","features","traits","resources","history"].forEach(k=>{o[k]=Array.isArray(d[k])?d[k]:[]});
  o.inspiration=Number(d.inspiration)||0;
  return o;
}
function slugify(name){
  const w=String(name||"").trim().split(/\s+/)[0]||"";
  const s=w.toLowerCase().replace(/[^a-z0-9]/g,"");
  return s||("pc"+Math.random().toString(36).slice(2,6));
}
function slugName(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,20)}
function convert(j,levelOf){
  if(j&&j.format==="sheet3"){
    const s=normalize(j.sheet||{});
    s.updated=Date.now();
    return {sheet:s,dm:j.dm||"",companions:Array.isArray(j.companions)?j.companions:[]};
  }
  const s=blank();
  s.name=j.name||"Unnamed";s.player=j.player||"";s.race=j.race||"";s.cls=j.class||"";s.subclass=j.subclass||"";
  s.alignment=j.alignment||"";s.size=j.size||"";s.level=Number(j.level)||1;s.background=j.background||"";
  const st=j.stats||[];
  ABIL.forEach((k,i)=>{if(st[i]!=null)s.abilities[k]=Number(st[i])});
  s.ac=Number(j.ac)||10;s.speed=parseInt(j.speed,10)||30;
  s.hpMax=Number(j.hp_max!=null?j.hp_max:j.hp)||10;
  s.hp=Number(j.hp_current!=null?j.hp_current:s.hpMax);
  s.hpTemp=Number(j.hp_temp)||0;s.hitDice=j.hit_dice||"";
  s.inspiration=Number(j.inspiration)||0;
  const pb=Number(j.proficiency)||prof(s.level);
  (j.saves||[]).forEach(t=>{
    const m=/^\s*([A-Za-z]+)/.exec(t);if(!m)return;
    const k=m[1].toLowerCase().slice(0,3);
    if(ABIL.indexOf(k)>=0)s.saveProf[k]=true;
  });
  (j.skills||[]).forEach(t=>{
    const m=/^(.*?)\s*([+-]\d+)\s*$/.exec(t);if(!m)return;
    const sk=SKILLS.filter(x=>x[0].toLowerCase()===m[1].trim().toLowerCase())[0];if(!sk)return;
    const diff=Number(m[2])-mod(s.abilities[sk[1]]);
    const lv=Math.max(0,Math.min(2,Math.floor(diff/pb)));
    const extra=diff-lv*pb;
    if(lv)s.skillProf[sk[0]]=lv;
    if(extra)s.skillExtra[sk[0]]=extra;
  });
  const info=classInfo(s.cls);
  if(info&&info.ab)s.spellAbility=info.ab;
  s.slots=slotsFor(info,s.level);
  s.languages=(j.languages||[]).join(", ");
  s.spells=(j.spells||[]).map(t=>{
    const nm=String(t).trim(),cant=/cantrip/i.test(nm);
    const clean=nm.replace(/\s*\([^)]*cantrip[^)]*\)/i,"").trim();
    let lv=cant?0:(levelOf?levelOf(clean):-1);if(lv==null)lv=-1;
    return {name:clean,level:lv,desc:""};
  });
  s.spellInfo=(j.spellcasting||[]).map(e=>({name:e.name||"",desc:e.desc||""}));
  const actionNames={};
  (j.actions||[]).forEach(a=>{
    const desc=a.desc||"";
    actionNames[String(a.name||"").toLowerCase()]=1;
    const hit=/([+-]\d+)\s+to hit/i.exec(desc);
    if(hit){
      const d=/Hit:\s*([^.]+?)\.(.*)$/i.exec(desc);
      s.attacks.push({name:a.name||"",bonus:hit[1],dmg:d?d[1].trim():"",notes:d?d[2].trim():""});
    }else s.actions.push({name:a.name||"",desc:desc});
  });
  const dmParts=[];
  (j.class_features||[]).forEach(f=>{
    const nm=f.name||"";
    if(/DM NOTE/i.test(nm)){dmParts.push(nm+": "+(f.desc||""));return}
    if(actionNames[nm.toLowerCase()])return;
    s.features.push({name:nm,desc:f.desc||""});
  });
  (j.traits||[]).forEach(t=>s.traits.push({name:t.name||"",desc:t.desc||""}));
  s.goals=(j.goals||[]).join("\n");
  s.backstory=j.backstory||"";
  const inv=[];
  (j.equipment||[]).forEach(line=>{
    const g=/^\s*(\d+)\s*gp\b[,\s]*(.*)$/i.exec(line);
    if(g){s.gold=Number(g[1]);if(g[2])inv.push(g[2])}
    else inv.push(line);
  });
  s.inventory=inv.join("\n");
  const die=info?info.die:8;
  s.resources=[{name:"Hit Dice (d"+die+")",max:s.level,used:0,reset:"hitdice"}];
  if(j.notes)dmParts.unshift(j.notes);
  s.updated=Date.now();
  return {sheet:s,dm:dmParts.join("\n\n"),companions:[]};
}

const pend={};
function queueWrite(key,ref,get,keys){
  const p=pend[key]||(pend[key]={keys:new Set()});
  p.ref=ref;p.get=get;keys.forEach(k=>p.keys.add(k));p.keys.add("updated");
  const o=get();if(o)o.updated=Date.now();
  clearTimeout(p.timer);p.timer=setTimeout(()=>flush(key),700);
  setStatus("Saving…");
}
async function flush(key){
  const p=pend[key];if(!p||!p.keys.size)return;
  const o=p.get();if(!o)return;
  if(p.busy){p.timer=setTimeout(()=>flush(key),300);return}
  const keys=Array.from(p.keys);p.keys=new Set();p.busy=true;
  const data={};keys.forEach(k=>{data[k]=o[k]===undefined?null:o[k]});
  try{await setDoc(p.ref,data,{mergeFields:keys});if(!p.keys.size)setStatus("Saved")}
  catch(e){keys.forEach(k=>p.keys.add(k));setStatus("Could not save ("+(e&&e.code||"error")+")",true)}
  finally{p.busy=false}
}
const saveChar=(id,keys)=>queueWrite("c:"+id,doc(db,"characters",id),()=>chars[id],keys);
const saveComp=(cid,pid,keys)=>queueWrite("p:"+cid+"/"+pid,doc(db,"characters",cid,"companions",pid),()=>companions[cid]&&companions[cid][pid],keys);
function keepLocal(prefix,id,remote,local){
  const p=pend[prefix+id];
  if(p&&p.keys&&p.keys.size&&local)p.keys.forEach(k=>{remote[k]=local[k]});
  return remote;
}

const KIND={pet:"Pet",form:"Wild Shape form",summon:"Summon",other:"Other"};
function blankComp(){
  const a={};ABIL.forEach(k=>a[k]=10);
  return {name:"New creature",kind:"pet",visible:false,size:"",type:"",cr:"",ac:10,hp:1,hpMax:1,hpTemp:0,speed:"30 ft.",abilities:a,saves:"",skills:"",senses:"",languages:"",traits:[],actions:[],conditions:"",notes:"",updated:0};
}
function normComp(d){
  const b=blankComp(),o=Object.assign({},b,d);
  o.abilities=Object.assign({},b.abilities,d.abilities||{});
  o.traits=Array.isArray(d.traits)?d.traits:[];o.actions=Array.isArray(d.actions)?d.actions:[];
  o.visible=!!d.visible;return o;
}
function splitTop(s){
  const out=[];let depth=0,cur="";
  for(const ch of String(s||"")){
    if(ch==="(")depth++;if(ch===")")depth=Math.max(0,depth-1);
    if(ch===","&&depth===0){out.push(cur.trim());cur=""}else cur+=ch;
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}
function listToEntries(s){
  return splitTop(s).map(t=>{const m=/^([^(]+?)\s*\((.*)\)\s*$/.exec(t);return m?{name:m[1].trim(),desc:m[2].trim()}:{name:t,desc:""}});
}
function fromMonster(m){
  const c=blankComp();
  c.name=m.name;c.type=m.type||"";c.cr=String(m.cr||"");c.ac=m.ac;c.hp=m.hp;c.hpMax=m.hp;c.speed=m.speed||"";
  ABIL.forEach(k=>{c.abilities[k]=m[k]!=null?m[k]:10});
  c.saves=m.saves||"";c.skills=m.skills||"";c.senses=m.senses||"";
  c.traits=listToEntries(m.traits);c.actions=listToEntries(m.actions);
  return c;
}
let monsterList=null;
function loadMonsters(){
  if(monsterList)return Promise.resolve(monsterList);
  return fetch("monsters.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(a=>{monsterList=a;return a});
}

      ["traits","actions"].forEach(list=>{
        h+='<div class="sub" style="margin:10px 0 4px;font-weight:700">'+(list==="traits"?"Traits":"Actions")+'</div>'+c[list].map((t,i)=>'<div class="entry-edit"><div class="h"><input type="text" data-comp="'+E(key)+'" data-path="'+list+'.'+i+'.name" value="'+E(t.name)+'" aria-label="Name"><button class="btn small danger" data-act="cdelentry" '+ctl+' data-list="'+list+'" data-i="'+i+'">✕</button></div><textarea data-comp="'+E(key)+'" data-path="'+list+'.'+i+'.desc" aria-label="Description">'+E(t.desc)+'</textarea></div>').join("")+'<button class="btn small" data-act="caddentry" '+ctl+' data-list="'+list+'">Add '+(list==="traits"?"trait":"action")+'</button>';

function compsFor(cid){return Object.keys(companions[cid]||{}).filter(pid=>isDM()||companions[cid][pid].visible).map(pid=>[pid,companions[cid][pid]])}
function tabPets(id){

/* ---- messages ---- */
function bubbles(cid){
  const me=isDM()?"dm":"player",list=messages[cid]||[];
  return list.length?list.map(m=>'<div class="bub '+(m.from===me?"me":"")+'">'+E(m.text)+'<div class="t">'+E(m.from==="dm"?"DM":"Player")+" · "+E(timeStr(m.t))+'</div></div>').join(""):'<div class="sub">No messages yet. Only you and '+(isDM()?"this player":"the DM")+' can see this conversation.</div>';
}
function msgPanel(cid){
  return '<div class="pane"><h3>Private messages <span class="sub">'+(isDM()?"only this player and you":"only you and your DM")+'</span></h3><div class="thread" id="thread" data-char="'+E(cid)+'">'+bubbles(cid)+'</div><div class="composer"><textarea id="msgIn" rows="2" placeholder="Write a message…" aria-label="Message"></textarea><button class="btn primary" data-act="send" data-char="'+E(cid)+'">Send</button></div></div>';
}
function updateThread(){
  const t=$("thread");if(!t)return;
  const atEnd=t.scrollHeight-t.scrollTop-t.clientHeight<60;
  t.innerHTML=bubbles(t.dataset.char);
  if(atEnd)t.scrollTop=t.scrollHeight;
  markRead(t.dataset.char);
}
function markRead(cid){
  const who=isDM()?"player":"dm",flag=isDM()?"readByDM":"readByPlayer";
  (messages[cid]||[]).forEach(m=>{
    if(m.from===who&&!m[flag]&&!markedRead.has(m.id)){
      markedRead.add(m.id);
      setDoc(doc(db,"characters",cid,"messages",m.id),{[flag]:true},{merge:true}).catch(()=>markedRead.delete(m.id));
    }
  });
}
async function sendMsg(cid,text){
  text=String(text||"").trim();if(!text)return false;
  const from=isDM()?"dm":"player";
  try{
    await setDoc(doc(collection(db,"characters",cid,"messages")),{from:from,text:text,t:Date.now(),readByDM:from==="dm",readByPlayer:from==="player"});
    return true;
  }catch(e){setStatus("Could not send ("+(e&&e.code||"error")+")",true);return false}
}
function renderDMMsgs(){
  const host=$("viewMsgs"),ids=Object.keys(chars).filter(id=>!chars[id].npc).sort((a,b)=>String(chars[a].name).localeCompare(String(chars[b].name)));

    host.innerHTML='<div class="dmbar"><button class="btn small" data-act="msgback">‹ All players</button><b>'+E((chars[dmMsgChar].name||"").split(" ")[0])+'</b> <span class="sub">'+E(chars[dmMsgChar].player||"")+'</span></div>'+msgPanel(dmMsgChar);
    const t=$("thread");if(t)t.scrollTop=t.scrollHeight;markRead(dmMsgChar);return;
  }

    return '<button class="btn" style="width:100%;text-align:left;margin-bottom:8px;display:block" data-act="msgopen" data-id="'+E(id)+'"><b>'+E((chars[id].name||"").split(" ")[0])+'</b> <span class="sub">'+E(chars[id].player||"")+'</span>'+(un?' <span class="badge ok">'+un+' new</span>':'')+'<div class="sub" style="font-weight:400">'+(last?E((last.from==="dm"?"You: ":"")+last.text.slice(0,80)):"No messages yet")+'</div></button>'}).join(""):'<div class="sub">No players yet.</div>')+'</div>'+
    '<div class="pane"><h3>Message everyone</h3><div class="composer"><textarea id="bcastIn" rows="2" placeholder="Sent privately to each player" aria-label="Message to all players"></textarea><button class="btn primary" data-act="bcast">Send to all</button></div></div>';
}

/* ================= sheet render ================= */
function renderSheet(){
  const host=$("viewSheet");
  if(!openId||!chars[openId]){host.innerHTML='<div class="empty">Loading your sheet…</div>';return}
  const c=chars[openId],can=canEditChar(openId);
  if(!can)editMode=false;
  let tab=sheetTab;
  if(tab==="spells"&&!hasSpells(c)&&!editMode)tab="play";
  let body="";
  if(tab==="play")body=tabPlay(openId);
  else if(tab==="stats")body=tabStats(openId);
  else if(tab==="spells")body=tabSpells(openId);
  else if(tab==="features")body=tabFeatures(openId);
  else if(tab==="gear")body=tabGear(openId);
  else if(tab==="pets")body=tabPets(openId);
  else if(tab==="msgs")body=msgPanel(openId);
  else if(tab==="lookup")body='<div id="lkHost"></div>';
  else if(tab==="dm"&&isDM())body=tabDM(openId);
  let h='<div class="sheet"><div class="sbar">'+(isDM()?'<button class="btn small" data-act="close" aria-label="Back to party">‹ Back</button>':'')+
    '<div class="sbar-title"><strong>'+E((c.name||"Unnamed").split(" ")[0])+'</strong><span class="sub" id="sbarStat">'+E(sbarStat(c))+'</span></div>'+
    (can&&["play","stats","spells","features","gear"].indexOf(tab)>=0?'<button class="btn small'+(editMode?" on":"")+'" data-act="edit" aria-pressed="'+editMode+'">'+(editMode?"✓ Done editing":"✎ Edit")+'</button>':'')+
    (can&&tab==="play"?'<div class="hpctl"><input type="number" id="hpAmt" min="0" inputmode="numeric" aria-label="Amount of damage or healing" value="'+E(hpAmtVal)+'"><button class="btn dmg" data-act="dmg">Damage</button><button class="btn heal" data-act="heal">Heal</button></div>':'')+
    '</div>'+body+'</div>';
  host.innerHTML=h;
  host.querySelectorAll("textarea").forEach(autosize);
  if(tab==="lookup")renderLookup($("lkHost"));
  if(tab==="msgs"){const t=$("thread");if(t){t.scrollTop=t.scrollHeight;markRead(openId)}}
}
function sbarStat(c){return "HP "+c.hp+" / "+c.hpMax+(c.hpTemp?" (+"+c.hpTemp+")":"")+" · AC "+c.ac+" · Level "+c.level}
function sheetFocused(){const a=document.activeElement;return !!(a&&$("app").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}

/* ================= nav & top-level render ================= */
function navItems(){
  const inSheet=!!(openId&&chars[openId]);
  if(inSheet){
    const c=chars[openId],items=[["play","🛡","Play"],["stats","📊","Stats"]];
    if(hasSpells(c)||editMode)items.push(["spells","✨","Spells"]);
    items.push(["features","📖","Features"],["gear","🎒","Gear"]);
    if(compsFor(openId).length||isDM())items.push(["pets","🐾","Pets"]);
    items.push(["msgs","✉️","Msgs"],["lookup","🔎","Lookup"]);
    if(isDM())items.push(["dm","🔒","DM"]);
    return {items:items,active:sheetTab,badge:{msgs:unreadFrom(openId,isDM()?"player":"dm")}};
  }
  if(isDM()){
    let un=0;Object.keys(chars).forEach(id=>{un+=unreadFrom(id,"player")});
    return {items:[["party","🏰","Party"],["msgs","✉️","Messages"],["lookup","🔎","Spells"],["campaign","📜","Campaign"]],active:dmTab,badge:{msgs:un}};
  }
  return {items:[],active:""};
}
function renderNav(){
  const nav=$("bnav"),n=navItems();
  nav.hidden=!n.items.length;
  document.body.classList.toggle("nonav",!n.items.length);
  const prev=nav.scrollLeft;
  nav.innerHTML=n.items.map(i=>'<button class="'+(n.active===i[0]?"on":"")+'" data-act="nav" data-tab="'+i[0]+'" aria-label="'+i[2]+'"><span class="ico">'+i[1]+'</span>'+i[2]+(n.badge&&n.badge[i[0]]?'<span class="n">'+n.badge[i[0]]+'</span>':"")+'</button>').join("");
  nav.scrollLeft=prev;
  const on=nav.querySelector(".on");
  if(on&&nav.scrollWidth>nav.clientWidth){
    const l=on.offsetLeft,r=l+on.offsetWidth;
    if(l<nav.scrollLeft||r>nav.scrollLeft+nav.clientWidth)nav.scrollLeft=Math.max(0,l-(nav.clientWidth-on.offsetWidth)/2);
  }
}
function renderApp(){
  if(!role)return;
  const inSheet=!!(openId&&chars[openId]),dm=isDM();
  const show={party:dm&&!inSheet&&dmTab==="party",msgs:dm&&!inSheet&&dmTab==="msgs",lookup:dm&&!inSheet&&dmTab==="lookup",camp:dm&&!inSheet&&dmTab==="campaign",sheet:inSheet||(!dm)};
  $("viewParty").hidden=!show.party;$("viewMsgs").hidden=!show.msgs;$("viewLookup").hidden=!show.lookup;$("viewCampaign").hidden=!show.camp;$("viewSheet").hidden=!show.sheet;
  document.body.classList.toggle("compact",show.sheet||show.camp);
  if(!show.party)$("viewParty").innerHTML="";
  if(!show.msgs)$("viewMsgs").innerHTML="";
  if(!show.lookup)$("viewLookup").innerHTML="";
  if(!show.sheet)$("viewSheet").innerHTML="";
  const focused=sheetFocused();
  if(show.party&&(!focused||!$("viewParty").firstChild))renderParty();
  if(show.msgs){if(dmMsgChar&&$("thread"))updateThread();else if(!focused||!$("viewMsgs").firstChild)renderDMMsgs()}
  if(show.lookup&&!$("viewLookup").firstChild)renderLookup($("viewLookup"));
  if(show.camp)ensureCampaign();
  if(show.sheet){
    if(!focused||!$("viewSheet").firstChild)renderSheet();
    else{const t=$("thread");if(t&&sheetTab==="msgs")updateThread();const sb=$("sbarStat");if(sb&&chars[openId])sb.textContent=sbarStat(chars[openId])}
  }
  renderNav();
}

/* ================= events ================= */
function setPath(obj,path,val){
  const p=path.split(".");let o=obj;
  for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}
  o[p[p.length-1]]=val;
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="hpAmt"){hpAmtVal=t.value;return}
  if(t.id==="lkQ"){lk.q=t.value;lk.limit=40;renderLookupResults();return}
  if(t.dataset&&t.dataset.dm==="notes"&&isDM()&&openId){dmNotes[openId]=t.value;autosize(t);queueNote(openId);return}
  const path=t.getAttribute&&t.getAttribute("data-path");
  if(!path)return;
  let val;
  if(t.type==="checkbox")val=t.checked;
  else if(t.type==="number")val=t.value===""?0:Number(t.value);
  else if(t.tagName==="SELECT"&&/\.level$/.test(path))val=Number(t.value);
  else val=t.value;
  if(t.dataset.comp){
    const parts=t.dataset.comp.split("|"),c=companions[parts[0]]&&companions[parts[0]][parts[1]];
    if(!c)return;setPath(c,path,val);if(t.tagName==="TEXTAREA")autosize(t);
    saveComp(parts[0],parts[1],[path.split(".")[0]]);return;
  }
  if(!openId||!canEditChar(openId))return;
  setPath(chars[openId],path,val);
  if(t.tagName==="TEXTAREA")autosize(t);
  const sb=$("sbarStat");if(sb)sb.textContent=sbarStat(chars[openId]);
  saveChar(openId,[path.split(".")[0]]);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="lkVer"){lk.ver=t.value;lk.limit=40;loadSpells(lk.ver).then(()=>renderLookupResults()).catch(()=>{});renderLookupResults();return}
  if(t.id==="lkCls"){lk.cls=t.value;lk.limit=40;renderLookupResults();return}
  if(t.id==="lkSch"){lk.sch=t.value;lk.limit=40;renderLookupResults();return}
  const path=t.getAttribute&&t.getAttribute("data-path");
  if(!path||t.dataset.comp||!openId||!canEditChar(openId))return;
  if(/^(abilities|level|spellAbility|slots|saveProf|resources)/.test(path)||t.type==="checkbox"||/^spells\.\d+\.level$/.test(path))renderSheet();
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.getAttribute("data-act"),c=openId?chars[openId]:null;
  switch(act){
    case "nav":{
      const tab=b.dataset.tab;
      if(openId&&chars[openId]){sheetTab=tab;lvlUp=null;renderSheet();renderNav();window.scrollTo(0,0)}
      else{dmTab=tab;if(tab!=="msgs")dmMsgChar=null;renderApp();window.scrollTo(0,0)}
      return}
    case "signout":return doSignOut();
    case "close":openId=null;lvlUp=null;sheetTab="play";editMode=false;renderApp();window.scrollTo(0,0);return;
    case "open":{const card=b.closest(".card");openId=card.dataset.id;sheetTab="play";lvlUp=null;editMode=false;renderApp();window.scrollTo(0,0);return}
    case "hp":{const card=b.closest(".card"),id=card.dataset.id,x=chars[id];x.hp=Math.max(0,Math.min(x.hpMax,x.hp+Number(b.dataset.d)));saveChar(id,["hp"]);renderParty();return}
    case "edit":editMode=!editMode;renderSheet();renderNav();return;
    case "import":$("importIn").click();return;
    case "addnpc":return addNpc();
    case "copy":{const code=b.dataset.code;(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>setStatus("Copied "+code)).catch(()=>window.prompt("Copy this:",code));return}
    case "setcode":return changeCode(b.dataset.id);
    case "matchcode":return setCodeTo(b.dataset.id,slugName(chars[b.dataset.id].player||chars[b.dataset.id].name));
    case "namecodes":return allNameCodes();
    case "msgopen":dmMsgChar=b.dataset.id;renderDMMsgs();return;
    case "msgback":dmMsgChar=null;renderDMMsgs();return;
    case "send":{const ta=$("msgIn");if(await sendMsg(b.dataset.char,ta.value)){ta.value=""}return}
    case "bcast":{const ta=$("bcastIn"),txt=ta.value.trim();if(!txt)return;for(const id of Object.keys(chars).filter(i=>!chars[i].npc))await sendMsg(id,txt);ta.value="";setStatus("Sent to everyone");return}
    case "lklv":lk.lv=b.dataset.v;lk.limit=40;renderLookup(b.closest("#viewLookup")||$("lkHost"));return;
    case "lkconc":lk.conc=!lk.conc;lk.limit=40;renderLookup(b.closest("#viewLookup")||$("lkHost"));return;
    case "lkrit":lk.rit=!lk.rit;lk.limit=40;renderLookup(b.closest("#viewLookup")||$("lkHost"));return;
    case "lkmore":lk.limit+=40;renderLookupResults();return;
    case "savecs":return saveCustomSpell();
    case "delcs":{if(confirm("Delete the custom spell “"+b.dataset.n+"”?"))deleteDoc(doc(db,"customSpells",slugId(b.dataset.n))).catch(()=>setStatus("Could not delete",true));return}
    case "addspell":{const ch=chars[charId];if(!ch)return;ch.spells.push({name:b.dataset.n,level:Number(b.dataset.l),desc:""});saveChar(charId,["spells"]);b.outerHTML='<span class="sub">Added to your spells.</span>';return}
    case "campParty":return sendParty(true);
    case "cadd":return addComp(b);
    case "cvis":{const x=companions[b.dataset.ch][b.dataset.pid];x.visible=!x.visible;saveComp(b.dataset.ch,b.dataset.pid,["visible"]);renderSheet();return}
    case "cedit":{const k=b.dataset.ch+"|"+b.dataset.pid;compEdit[k]=!compEdit[k];renderSheet();return}
    case "cdel":{if(confirm("Delete this creature?"))deleteDoc(doc(db,"characters",b.dataset.ch,"companions",b.dataset.pid)).catch(()=>setStatus("Could not delete",true));return}
    case "chp":{const x=companions[b.dataset.ch]&&companions[b.dataset.ch][b.dataset.pid];if(!x)return;x.hp=Math.max(0,Math.min(x.hpMax,x.hp+Number(b.dataset.d)));saveComp(b.dataset.ch,b.dataset.pid,["hp"]);renderSheet();return}
    case "caddentry":{const x=companions[b.dataset.ch][b.dataset.pid];x[b.dataset.list].push({name:"",desc:""});saveComp(b.dataset.ch,b.dataset.pid,[b.dataset.list]);renderSheet();return}
    case "cdelentry":{const x=companions[b.dataset.ch][b.dataset.pid];x[b.dataset.list].splice(Number(b.dataset.i),1);saveComp(b.dataset.ch,b.dataset.pid,[b.dataset.list]);renderSheet();return}
  }
  if(!c||!canEditChar(openId)){if(act==="delsheet"&&isDM()&&c)return delSheet();return}
  const id=openId;
  switch(act){
    case "dmg":case "heal":{
      const amt=Math.max(0,Math.floor(Number(hpAmtVal)||0));
      if(act==="dmg"){let rem=amt;const t=Math.min(c.hpTemp||0,rem);c.hpTemp=(c.hpTemp||0)-t;rem-=t;c.hp=Math.max(0,c.hp-rem)}
      else{if(c.hp===0&&amt>0){c.deathS=0;c.deathF=0}c.hp=Math.min(c.hpMax,c.hp+amt)}
      saveChar(id,["hp","hpTemp","deathS","deathF"]);renderSheet();return}
    case "insp":c.inspiration=Math.max(0,c.inspiration+Number(b.dataset.d));saveChar(id,["inspiration"]);renderSheet();return;
    case "death":{const k=b.dataset.k,i=Number(b.dataset.i),f=k==="S"?"deathS":"deathF";c[f]=(i<c[f])?i:i+1;saveChar(id,[f]);renderSheet();return}
    case "rpip":{const r=c.resources[Number(b.dataset.r)],i=Number(b.dataset.i);r.used=(i<r.used)?i:i+1;saveChar(id,["resources"]);renderSheet();return}
    case "rcnt":{const r=c.resources[Number(b.dataset.r)];r.used=Math.max(0,Math.min(r.max,r.used+Number(b.dataset.d)));saveChar(id,["resources"]);renderSheet();return}
    case "spip":{const l=b.dataset.l,s=c.slots[l],i=Number(b.dataset.i);s.used=(i<s.used)?i:i+1;saveChar(id,["slots"]);renderSheet();return}
    case "addres":c.resources.push({name:"New resource",max:1,used:0,reset:"long"});saveChar(id,["resources"]);renderSheet();return;
    case "delres":c.resources.splice(Number(b.dataset.r),1);saveChar(id,["resources"]);renderSheet();return;
    case "rest":return doRest(b.dataset.k);
    case "skill":{const s=b.dataset.skill;c.skillProf[s]=((Number(c.skillProf[s])||0)+1)%3;saveChar(id,["skillProf"]);renderSheet();return}
    case "addatk":c.attacks.push({name:"",bonus:"",dmg:"",notes:""});saveChar(id,["attacks"]);renderSheet();return;
    case "delatk":c.attacks.splice(Number(b.dataset.i),1);saveChar(id,["attacks"]);renderSheet();return;
    case "addentry":{const l=b.dataset.list;(c[l]=c[l]||[]).push({name:"",desc:""});saveChar(id,[l]);renderSheet();return}
    case "delentry":{const l=b.dataset.list;c[l].splice(Number(b.dataset.i),1);saveChar(id,[l]);renderSheet();return}
    case "delspell":c.spells.splice(Number(b.dataset.i),1);saveChar(id,["spells"]);renderSheet();return;
    case "addspellman":{const n=$("newSpell").value.trim();if(!n)return;c.spells.push({name:n,level:Number($("newSpellLv").value),desc:""});saveChar(id,["spells"]);renderSheet();return}
    case "lvlopen":lvlUp={gain:hpGainDefault(c)};sheetTab="play";renderSheet();renderNav();window.scrollTo(0,0);return;
    case "lvlcancel":lvlUp=null;renderSheet();return;
    case "lvlconfirm":return confirmLevelUp(c);
    case "delsheet":return delSheet();
  }
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="codeIn"&&e.key==="Enter")$("joinBtn").click();
  if(e.target.id==="msgIn"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)){const b=document.querySelector('[data-act="send"]');if(b)b.click()}
});
function doRest(kind){
  const c=chars[openId],info=classInfo(c.cls),pact=info&&info.caster==="pact";
  const msg=kind==="long"?"Take a long rest? This restores your HP, spell slots and all limited-use features.":"Take a short rest? This restores short-rest features"+(pact?" and your pact slots":"")+".";
  if(!confirm(msg))return;
  const keys=["resources"];
  c.resources.forEach(r=>{
    if(kind==="long"){if(r.reset==="hitdice")r.used=Math.max(0,r.used-Math.ceil(r.max/2));else if(r.reset!=="manual")r.used=0}
    else if(r.reset==="short"||r.reset==="combat")r.used=0;
  });
  if(kind==="long"){c.hp=c.hpMax;c.hpTemp=0;c.deathS=0;c.deathF=0;Object.keys(c.slots).forEach(k=>{c.slots[k].used=0});keys.push("hp","hpTemp","deathS","deathF","slots")}
  else if(pact){Object.keys(c.slots).forEach(k=>{c.slots[k].used=0});keys.push("slots")}
  saveChar(openId,keys);renderSheet();setStatus(kind==="long"?"Long rest taken":"Short rest taken");
}
function confirmLevelUp(c){
  const gain=Math.max(0,Math.floor(Number($("lvGain").value)||0));
  const updSlots=$("lvSlots")?$("lvSlots").checked:false;
  const info=classInfo(c.cls),die=info?info.die:8,nl=c.level+1,old=c.level;
  c.level=nl;c.hpMax+=gain;c.hp+=gain;
  const m=/^(\d+)d(\d+)$/.exec(String(c.hitDice||"").trim());
  c.hitDice=nl+"d"+(m?m[2]:die);
  c.resources.forEach(r=>{if(r.reset==="hitdice"){r.max=nl}});
  if(updSlots)c.slots=slotsFor(info,nl,c.slots);
  c.history=[{t:Date.now(),text:"Level "+old+" → "+nl+": +"+gain+" max HP"}].concat(c.history).slice(0,30);
  lvlUp=null;
  saveChar(openId,["level","hpMax","hp","hitDice","slots","history","resources"]);
  renderSheet();window.scrollTo(0,0);
}

/* ================= DM tools ================= */
const slugId=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("s"+Date.now());
async function addNpc(){
  const id="npc"+Math.random().toString(36).slice(2,8),c=blank();c.name="New NPC";c.npc=true;c.updated=Date.now();
  try{await setDoc(doc(db,"characters",id),c);chars[id]=c;openId=id;sheetTab="play";editMode=true;renderApp();window.scrollTo(0,0)}

}
async function delSheet(){
  const c=chars[openId];if(!c)return;
  if(!confirm("Delete “"+(c.name||"this sheet")+"” for good? This also removes its DM notes, creatures, messages and login name."))return;
  const id=openId;openId=null;lvlUp=null;renderApp();
  try{
    for(const pid of Object.keys(companions[id]||{}))await deleteDoc(doc(db,"characters",id,"companions",pid));
    for(const m of (messages[id]||[]))await deleteDoc(doc(db,"characters",id,"messages",m.id));
    await deleteDoc(doc(db,"characters",id));
    await deleteDoc(doc(db,"dmnotes",id));
    if(claimByChar[id])await deleteDoc(doc(db,"claims",claimByChar[id]));
  }catch(err){setStatus("Could not delete ("+(err&&err.code||"error")+")",true)}
}
async function setCodeTo(id,code){
  code=slugName(code);
  if(code.length<2){setStatus("A login name needs at least 2 letters or numbers",true);return false}
  const taken=Object.keys(claimByChar).filter(k=>claimByChar[k]===code&&k!==id)[0];
  if(taken){setStatus("“"+code+"” is already used by another character",true);return false}
  const old=claimByChar[id];if(old===code)return true;
  try{
    await setDoc(doc(db,"claims",code),{charId:id});
    claimByChar[id]=code;
    if(old)await deleteDoc(doc(db,"claims",old));
    setStatus("Login name set to “"+code+"”");return true;
  }catch(err){setStatus("Could not set login name ("+(err&&err.code||"error")+")",true);return false}
}
function changeCode(id){
  const cur=claimByChar[id]||slugName(chars[id].player||chars[id].name);
  const v=window.prompt("Login name for "+(chars[id].player||chars[id].name)+" (letters and numbers only). Anyone who knows it can open this sheet, so use something harder to guess if you like.",cur);
  if(v)setCodeTo(id,v).then(()=>renderApp());
}
async function allNameCodes(){
  const ids=Object.keys(chars).filter(id=>!chars[id].npc);
  for(const id of ids){await setCodeTo(id,slugName(chars[id].player||chars[id].name))}
  renderApp();
}
async function saveCustomSpell(){
  const name=$("csName").value.trim();if(!name){setStatus("Give the spell a name",true);return}
  const s={n:name,l:Number($("csLevel").value),s:$("csSchool").value.trim(),t:$("csTime").value.trim(),r:$("csRange").value.trim(),c:$("csComp").value.trim(),d:$("csDur").value.trim(),k:$("csConc").checked?1:0,i:$("csRit").checked?1:0,cl:$("csCls").value.split(",").map(x=>x.trim()).filter(Boolean),x:$("csText").value,h:$("csHigh").value};
  try{await setDoc(doc(db,"customSpells",slugId(name)),s);lk.csOpen=false;setStatus("Custom spell saved");renderLookup($("viewLookup").hidden?$("lkHost"):$("viewLookup"))}
  catch(err){setStatus("Could not save spell ("+(err&&err.code||"error")+")",true)}
}
async function addComp(b){
  const cid=openId;let c;
  if(b.dataset.from==="tpl"){
    const i=$("cTemplate").value;if(i==="")return;
    const list=await loadMonsters();c=fromMonster(list[Number(i)]);
  }else c=blankComp();
  c.kind=$("cKind").value;c.updated=Date.now();
  try{await setDoc(doc(collection(db,"characters",cid,"companions")),c);setStatus("Creature added (hidden from the player until you show it)")}
  catch(err){setStatus("Could not add ("+(err&&err.code||"error")+")",true)}
}
document.addEventListener("change",async e=>{
  if(e.target.id!=="importIn")return;
  const files=Array.from(e.target.files||[]);e.target.value="";
  const setMsg=t=>{importMsg=t;const m=$("importMsg");if(m){m.hidden=!t;m.textContent=t}};
  setMsg("Importing…");
  try{await loadSpells("2014")}catch(err){}
  const levelOf=n=>{const s=findSpellIn("2014",n);return s?s.l:null};
  const done=[],skipped=[];
  for(const f of files){
    try{
      const j=JSON.parse(await f.text());
      const r=convert(j,levelOf),id=slugify(r.sheet.name);
      if(chars[id]&&!confirm("A sheet for “"+(chars[id].name||id).split(" ")[0]+"” already exists. Replace it with "+f.name+"? This overwrites everything on that sheet (HP, notes, level-ups)."))
        {skipped.push(f.name);continue}
      await setDoc(doc(db,"characters",id),r.sheet);
      await setDoc(doc(db,"dmnotes",id),{text:r.dm});
      const have=(companions[id]||{}),names=Object.keys(have).map(k=>have[k].name);
      for(const comp of r.companions){if(names.indexOf(comp.name)<0)await setDoc(doc(collection(db,"characters",id,"companions")),normComp(comp))}
      chars[id]=normalize(r.sheet);
      const want=slugName(r.sheet.player||r.sheet.name);
      if(want)await setCodeTo(id,want);
      done.push(r.sheet.name.split(" ")[0]);
    }catch(err){skipped.push(f.name+" ("+(err&&err.code||err&&err.message||"error")+")")}
  }
  setMsg((done.length?"Imported: "+done.join(", ")+". Login names are under “Player names”. ":"")+(skipped.length?"Skipped: "+skipped.join(", ")+".":""));
  if(done.length){codesOpen=true;const cb=$("codesBox");if(cb)cb.open=true}
});
function findSpellIn(ver,name){
  const idx=spellIdx[ver];if(!idx)return null;
  const n=String(name||"").toLowerCase().replace(/\s*\([^)]*\)\s*$/,"").trim();
  return idx.get(n)||idx.get(ALIAS[n]||"")||null;
}

/* ================= campaign tool (DM only) ================= */
let campInit=false, campSent="";
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
async function pack(str){
  if(typeof CompressionStream==="undefined")return {enc:"raw",data:str};
  const cs=new CompressionStream("gzip"),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();
  const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin="";
  for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));
  return {enc:"gzip",data:btoa(bin)};
}
async function unpack(enc,data){
  if(enc!=="gzip"||!data)return data||"";
  const bin=atob(data),buf=Uint8Array.from(bin,c=>c.charCodeAt(0)),ds=new DecompressionStream("gzip"),w=ds.writable.getWriter();
  w.write(buf);w.close();return await new Response(ds.readable).text();
}
const campMeta=()=>{try{return JSON.parse(localStorage.getItem("lazy-dm-sync")||"{}")}catch(e){return {}}};
function campStatus(t,err){const s=$("campStatus");if(s){s.textContent=t;s.className="sub"+(err?" err":"")}}
async function pushCampaign(){
  const v3=localStorage.getItem("lazy-dm-v3")||"",web=localStorage.getItem("lazy-dm-web")||"";
  const a=await pack(v3),b=await pack(web);
  if(a.data.length+b.data.length>900000){campStatus("Campaign data is too big to sync (over 900 KB). Export a session and clear old history.",true);return}
  const updated=Date.now();
  await setDoc(doc(db,"dmdata","lazydm"),{enc:a.enc,v3:a.data,web:b.data,updated:updated});
  localStorage.setItem("lazy-dm-sync",JSON.stringify({updated:updated,v3:hash(v3),web:hash(web)}));
  campStatus("Campaign saved to the cloud "+new Date(updated).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
}
async function pullCampaign(){
  try{
    const snap=await getDoc(doc(db,"dmdata","lazydm"));
    const v3=localStorage.getItem("lazy-dm-v3"),web=localStorage.getItem("lazy-dm-web"),m=campMeta();
    const localDirty=(v3||web)&&(hash(v3||"")!==m.v3||hash(web||"")!==m.web);
    if(snap.exists()){
      const d=snap.data(),cloudNewer=(d.updated||0)>(m.updated||0);
      if(cloudNewer&&(!localDirty||confirm("The cloud copy of your campaign is newer than this device's copy. OK uses the cloud copy. Cancel keeps this device's copy and overwrites the cloud."))){
        const a=await unpack(d.enc,d.v3),b=await unpack(d.enc,d.web);
        if(a)localStorage.setItem("lazy-dm-v3",a);else localStorage.removeItem("lazy-dm-v3");
        if(b)localStorage.setItem("lazy-dm-web",b);else localStorage.removeItem("lazy-dm-web");
        localStorage.setItem("lazy-dm-sync",JSON.stringify({updated:d.updated,v3:hash(a||""),web:hash(b||"")}));
        campStatus("Loaded your campaign from the cloud");
      }else if(localDirty)await pushCampaign();
      else campStatus("Campaign is up to date");
    }else if(v3||web)await pushCampaign();
    else campStatus("New campaign. It saves to the cloud automatically.");
  }catch(e){campStatus("Could not reach the cloud copy ("+(e&&e.code||"error")+"). Changes stay on this device.",true)}
}
async function syncCampaignTick(){
  if(!isDM()||!campInit)return;
  const v3=localStorage.getItem("lazy-dm-v3")||"",web=localStorage.getItem("lazy-dm-web")||"",m=campMeta();
  if(hash(v3)!==m.v3||hash(web)!==m.web){try{await pushCampaign()}catch(e){campStatus("Could not save to the cloud ("+(e&&e.code||"error")+")",true)}}
}
function toLegacy(id){
  const c=chars[id],st=spellStats(c),pb=prof(c.level);
  const spellNames=c.spells.map(s=>s.name+(s.level===0?" (cantrip)":""));
  const out={name:c.name,player:c.player,size:c.size,race:c.race,type:"humanoid",class:c.cls,subclass:c.subclass,alignment:c.alignment,level:c.level,
    ac:c.ac,hp:c.hpMax,hp_max:c.hpMax,hp_current:c.hp,hp_temp:c.hpTemp,hit_dice:c.hitDice,speed:c.speed+" ft.",stats:ABIL.map(k=>c.abilities[k]),
    saves:ABIL.filter(k=>c.saveProf[k]).map(k=>k[0].toUpperCase()+k.slice(1)+" "+sgn(mod(c.abilities[k])+pb)),
    skills:SKILLS.filter(s=>c.skillProf[s[0]]||c.skillExtra[s[0]]).map(s=>s[0]+" "+sgn(skillTotal(c,s))),
    languages:String(c.languages||"").split(",").map(x=>x.trim()).filter(Boolean),proficiency:pb,passive_perception:passive(c),background:c.background,inspiration:c.inspiration,
    equipment:String(c.inventory||"").split("\n").filter(Boolean).concat(c.gold?[c.gold+" gp"]:[]),spells:spellNames,
    spellcasting:(st?[{name:"Spellcasting",desc:"Spell save DC "+st.dc+"; spell attack "+sgn(st.atk)+"."}]:[]).concat(c.spellInfo),
    actions:c.attacks.map(a=>({name:a.name,desc:"Weapon Attack: "+a.bonus+" to hit. Hit: "+a.dmg+"."+(a.notes?" "+a.notes:"")})).concat(c.actions),
    class_features:c.features,traits:c.traits,goals:String(c.goals||"").split("\n").filter(Boolean),backstory:c.backstory,notes:dmNotes[id]||""};
  return out;
}
function sendParty(force){
  const f=$("campFrame");if(!f||!f.contentWindow)return;
  const sheets=Object.keys(chars).filter(id=>!chars[id].npc).map(toLegacy);
  const json=JSON.stringify(sheets);
  if(!force&&json===campSent)return;
  campSent=json;f.contentWindow.postMessage({type:"party",sheets:sheets},location.origin);
  campStatus("Party sheets sent to the campaign tool");
}
async function ensureCampaign(){
  const host=$("viewCampaign");
  if(campInit){sendParty(false);return}
  campInit=true;
  host.innerHTML='<div class="camp-bar"><span id="campStatus" class="sub">Loading your campaign…</span><button class="btn small" data-act="campParty">Refresh party sheets</button></div><iframe id="campFrame" title="Campaign tool"></iframe>';
  await pullCampaign();
  const f=$("campFrame");
  f.addEventListener("load",()=>setTimeout(()=>sendParty(true),500));
  f.src="campaign.html";
  setInterval(syncCampaignTick,5000);
  window.addEventListener("pagehide",()=>{syncCampaignTick()});
}

/* ================= live data ================= */
function subscribeChar(id){
  if(charSubs[id]||chars[id]&&chars[id].npc)return;
  charSubs[id]=[
    onSnapshot(collection(db,"characters",id,"companions"),snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=keepLocal("p:"+id+"/",d.id,normComp(d.data()||{}),companions[id]&&companions[id][d.id])});
      companions[id]=m;renderApp();
    },()=>{}),
    onSnapshot(query(collection(db,"characters",id,"messages"),orderBy("t")),snap=>{
      messages[id]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderApp();
    },()=>{})
  ];
}
function startApp(){
  $("gate").hidden=true;$("app").hidden=false;
  unsubs.forEach(u=>u());unsubs=[];Object.keys(charSubs).forEach(k=>charSubs[k].forEach(u=>u()));charSubs={};
  chars={};dmNotes={};claimByChar={};companions={};messages={};customSpells=[];lvlUp=null;editMode=false;
  $("who").innerHTML=isDM()?'<span class="badge dm">Dungeon Master</span>':'<span class="badge">Player</span>';
  $("outBtn").hidden=false;
  unsubs.push(onSnapshot(collection(db,"customSpells"),snap=>{customSpells=snap.docs.map(d=>d.data());if($("lkQ"))renderLookupResults()},()=>{}));
  if(isDM()){
    openId=null;dmTab="party";sheetTab="play";
    unsubs.push(onSnapshot(collection(db,"characters"),snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=keepLocal("c:",d.id,normalize(d.data()||{}),chars[d.id])});
      chars=next;if(openId&&!chars[openId])openId=null;
      Object.keys(chars).forEach(subscribeChar);
      renderApp();setStatus("Live");
    },e=>setStatus("Sync problem ("+(e&&e.code||"error")+")",true)));
    unsubs.push(onSnapshot(collection(db,"claims"),snap=>{claimByChar={};snap.docs.forEach(d=>{const cid=(d.data()||{}).charId;if(cid)claimByChar[cid]=d.id});renderApp()},()=>{}));
    unsubs.push(onSnapshot(collection(db,"dmnotes"),snap=>{
      const next={};snap.docs.forEach(d=>{next[d.id]=(d.data()||{}).text||""});
      const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.dm))dmNotes=next;
    },()=>{}));
  }else{
    openId=charId;sheetTab="play";
    unsubs.push(onSnapshot(doc(db,"characters",charId),snap=>{
      if(!snap.exists()){chars={};$("notice").innerHTML='<div class="note">Your sheet isn’t set up yet. Ask your DM.</div>';renderApp();return}
      $("notice").innerHTML="";
      chars[charId]=keepLocal("c:",charId,normalize(snap.data()||{}),chars[charId]);
      renderApp();setStatus("Live");
    },e=>{
      if(e&&e.code==="permission-denied")showGate("Your login no longer works. Type your name again, or ask your DM.");
      else setStatus("Sync problem ("+(e&&e.code||"error")+")",true);
    }));
    unsubs.push(onSnapshot(query(collection(db,"characters",charId,"companions"),where("visible","==",true)),snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=keepLocal("p:"+charId+"/",d.id,normComp(d.data()||{}),companions[charId]&&companions[charId][d.id])});
      companions[charId]=m;renderApp();
    },()=>{}));
    unsubs.push(onSnapshot(query(collection(db,"characters",charId,"messages"),orderBy("t")),snap=>{
      messages[charId]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderApp();
    },()=>{}));
  }
  renderApp();
}

/* ================= auth flow ================= */
function showGate(msg){
  unsubs.forEach(u=>u());unsubs=[];Object.keys(charSubs).forEach(k=>charSubs[k].forEach(u=>u()));charSubs={};
  chars={};openId=null;role=null;lvlUp=null;
  $("app").hidden=true;$("gate").hidden=false;$("bnav").hidden=true;document.body.classList.add("nonav");document.body.classList.remove("compact");
  $("who").textContent="Not signed in";$("outBtn").hidden=!uid;
  const m=$("gateMsg");m.className="msg"+(msg?" err":"");m.textContent=msg||"";
}
async function enter(user){
  const tok=++enterTok;
  if(!user){uid=null;showGate();return}
  uid=user.uid;isAnon=user.isAnonymous;role=null;charId=null;
  try{await getDoc(doc(db,"config","dm"));role="dm"}catch(e){}
  if(!role){
    try{const m=await getDoc(doc(db,"members",uid));if(m.exists()&&m.data().charId){role="player";charId=m.data().charId}}catch(e){}
  }
  if(tok!==enterTok)return;
  if(!role){showGate(isAnon?"":"That Google account isn’t the DM account. Players: type your name.");return}
  startApp();
}
onAuthStateChanged(auth,user=>{enter(user)});
$("joinBtn").addEventListener("click",async()=>{
  const code=slugName($("codeIn").value),msg=$("gateMsg");
  if(code.length<2){msg.className="msg err";msg.textContent="Type your first name.";return}
  msg.className="msg";msg.textContent="Opening…";
  try{
    if(!auth.currentUser)await signInAnonymously(auth);
    const claim=await getDoc(doc(db,"claims",code));
    if(!claim.exists()){msg.className="msg err";msg.textContent="That name isn’t right. Check it with your DM.";return}
    const cid=claim.data().charId;
    await setDoc(doc(db,"members",auth.currentUser.uid),{code:code,charId:cid,joinedAt:serverTimestamp()});
    msg.textContent="";
    await enter(auth.currentUser);
  }catch(e){
    msg.className="msg err";
    msg.textContent=(e&&e.code==="permission-denied")?"That name isn’t right. Check it with your DM.":"Could not open ("+(e&&e.code||"error")+").";
  }
});
$("googleBtn").addEventListener("click",async()=>{
  const msg=$("gateMsg2");msg.className="msg";msg.textContent="";
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){msg.className="msg err";msg.textContent="Google sign-in failed ("+(e&&e.code||"error")+")."}
});
async function doSignOut(){
  if(isAnon&&!confirm("Sign out? You can get back in any time by typing your name."))return;
  await signOut(auth);
}
